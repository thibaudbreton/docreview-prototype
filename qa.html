/* Antarctica — the brand title face. Not on any public CDN and not installed
   here, so it resolves in this order: an installed copy, then the files under
   fonts/ (drop Antarctica-Regular.woff2 and Antarctica-Bold.woff2 there — the
   srcdoc screens resolve relative URLs against index.html), then Alstom.
   Nothing breaks while the files are missing; titles simply stay in Alstom. */
@font-face{font-family:"Antarctica";font-weight:400;font-display:swap;src:local("Antarctica"),local("Antarctica-Regular"),url("fonts/Antarctica-Regular.woff2") format("woff2")}
@font-face{font-family:"Antarctica";font-weight:700;font-display:swap;src:local("Antarctica Bold"),local("Antarctica-Bold"),url("fonts/Antarctica-Bold.woff2") format("woff2")}
/* Alstom — the brand's own typeface (DEC-115): all interface text, and the
   titles until Antarctica is supplied. Licensed: build_fonts.py makes the web
   copies under fonts/, never versioned; build_merge.py embeds them only in the
   outputs allowed to carry them. Never local(): the desktop TTFs carry 1-bit
   bitmaps that Chrome on Windows draws instead of the outlines at 9-18 px.
   Matched to Noto Sans, the fallback: size-adjust brings its x-height to
   Noto's (0.479 → 0.536 em) and the overrides set Noto's ascent and descent
   (1.069 / 0.293 em, divided by the 1.12 they get scaled by) — same baseline,
   same line boxes, so the fallback changes the letters, never the layout.
   No SemiBold or ExtraBold in the family: 600 is drawn with the Medium, 800
   with the Bold, each declared as its own face so Chrome doesn't fake-bolden
   it. No italic either: italics are the Regular slanted, which is what this
   kind of face does anyway. */
@font-face{font-family:"Alstom UI";font-weight:400;font-display:swap;src:url("fonts/Alstom-Regular.woff") format("woff");size-adjust:112%;ascent-override:95.4%;descent-override:26.2%;line-gap-override:0%}
@font-face{font-family:"Alstom UI";font-weight:500;font-display:swap;src:url("fonts/Alstom-Medium.woff") format("woff");size-adjust:112%;ascent-override:95.4%;descent-override:26.2%;line-gap-override:0%}
@font-face{font-family:"Alstom UI";font-weight:600;font-display:swap;src:url("fonts/Alstom-Medium.woff") format("woff");size-adjust:112%;ascent-override:95.4%;descent-override:26.2%;line-gap-override:0%}
@font-face{font-family:"Alstom UI";font-weight:700;font-display:swap;src:url("fonts/Alstom-Bold.woff") format("woff");size-adjust:112%;ascent-override:95.4%;descent-override:26.2%;line-gap-override:0%}
@font-face{font-family:"Alstom UI";font-weight:800;font-display:swap;src:url("fonts/Alstom-Bold.woff") format("woff");size-adjust:112%;ascent-override:95.4%;descent-override:26.2%;line-gap-override:0%}

:root{
  --bg:#071A30; --panel:#0B294A; --panel-2:#143556; --panel-3:#1D4062;
  --line:#1F3E5F; --line-2:#2E4E70;
  --text:#EEF1F8; --text-2:#AAB6C6; --text-3:#8B9AAD;
  --accent:#4C82FF; --accent-soft:#1B3F6B; --accent-hover:color-mix(in srgb, var(--accent) 75%, white);
  --ia:#E3A64B; --ia-soft:rgba(227,166,75,.12);
  --ok:#3FBE86; --ok-soft:rgba(63,190,134,.12);
  --human:#a06ef2; --human-soft:rgba(160,110,242,.12);
  --warn:#F2604F; --warn-soft:rgba(242,96,79,.12);
  --paper:#fbfaf6; --paper-ink:#1d2129; --paper-ink-2:#4a5162;
  --text-xs:11px; --text-sm:12px; --text-base:13px; --text-lg:16px; --text-xl:21px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px;
  --radius-xs:4px; --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-pill:999px;
  --font-ui:"Alstom UI","Noto Sans","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-heading:"Antarctica","Alstom UI","Noto Sans","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --brand-red:#E4002B; /* placeholder — exact brand red to confirm */
  --font-doc:Georgia,"Times New Roman",serif;
  --font-mono:"Alstom UI",ui-monospace,"SF Mono","Cascadia Code",Menlo,monospace; /* IDs and codes: the brand face (its figures all share one width, so IDs still line up), the monospace stack wherever it is absent */
}

html[data-theme="light"]{
  --bg:#F4F5FA;
  --panel:#FFFFFF;
  --panel-2:#F4F5FA;
  --panel-3:#E6E6F0;
  --line:#E1E3EE;
  --line-2:#CDD2E3;
  --text:#1E3246;
  --text-2:#4A5A6E;
  --text-3:#637187;
  --accent:#0B294A;
  --accent-soft:#E6EBF2;
  --ia:#C67A16;
  --ia-soft:rgba(198,122,22,.12);
  --ok:#1E8E5A;
  --ok-soft:rgba(30,142,90,.12);
  --human:#8250dc;
  --human-soft:rgba(130,80,220,.12);
  --warn:#DC3223;
  --warn-soft:rgba(220,50,35,.10);
  --paper:#ffffff;
  --paper-ink:#1d2129;
  --paper-ink-2:#4a5162;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);font-size:var(--text-base);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:var(--radius-sm);border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius-xs)}
#app{display:flex;flex-direction:column;height:100vh}

/* ---------- Header ---------- */
header{display:flex;align-items:center;gap:var(--space-4);height:52px;padding:0 var(--space-4);background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
.logo{display:flex;align-items:center;gap:var(--space-2);font-weight:700;font-size:var(--text-base);letter-spacing:-.2px}
/* the company's logo, then the product's name in text (2026-10-09) — the SRM
   mark stays the favicon. Colour on light, white on dark: the files supplied,
   not tokens; height on the cap line of "SRM" */
.brand-logo{display:flex;align-items:center;padding-right:var(--space-4);border-right:1px solid var(--line);height:20px;flex-shrink:0}
.brand-logo img{height:15px;width:auto;display:block}
.brand-logo .brand-light{display:none}
html[data-theme="light"] .brand-logo .brand-light{display:block}
html[data-theme="light"] .brand-logo .brand-dark{display:none}
.crumb{display:flex;align-items:center;gap:var(--space-2);color:var(--text-2);min-width:0}
.crumb .sep{color:var(--text-3)}
.crumb .project{color:var(--text);font-weight:600;white-space:nowrap;text-decoration:none;cursor:pointer;border-radius:var(--radius-xs);transition:color .15s}
.crumb .project:hover{color:var(--accent)}
.hdr-actions{display:flex;align-items:center;gap:8px}
.icon-btn{position:relative;width:32px;height:32px;border-radius:var(--radius-md);display:grid;place-items:center;color:var(--text-2);transition:all .15s}
.icon-btn:hover{background:var(--panel-3);color:var(--text)}

/* Notification bell. It was inert here — a control that does nothing on four
   screens out of five teaches the reader that it does nothing anywhere. The
   list is computed from THIS screen's own state, never a fixed script: if
   nothing is waiting, it says so rather than inventing an item. */
.notif-wrap{position:relative;display:inline-flex}
.notif-drop{position:absolute;top:calc(100% + 8px);right:0;width:330px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--radius-lg);box-shadow:0 16px 48px rgba(0,0,0,.28);z-index:60;display:none;overflow:hidden;text-align:left}
.notif-drop.open{display:block}
.notif-drop .nd-head{padding:var(--space-3) var(--space-4);font-size:var(--text-base);font-weight:600;border-bottom:1px solid var(--line)}
.nd-item{display:flex;gap:var(--space-3);width:100%;padding:var(--space-3) var(--space-4);cursor:pointer;transition:background .12s;border-bottom:1px solid var(--line);text-align:left}
.nd-item:last-child{border-bottom:none}
.nd-item:hover{background:var(--panel-3)}
.nd-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.nd-text{font-size:var(--text-sm);color:var(--text-2);line-height:1.45}
.nd-text b{color:var(--text)}
.nd-time{font-size:var(--text-xs);color:var(--text-3);margin-top:2px}
.nd-empty{padding:var(--space-4);font-size:var(--text-sm);color:var(--text-3);line-height:1.5}
.notif-wrap .badge-dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--warn);pointer-events:none}

.badge-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--warn);border:2px solid var(--panel)}
.btn-primary{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-radius:var(--radius-md);background:var(--accent);color:#fff;font-weight:600;font-size:var(--text-base);transition:all .15s}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-ghost{padding:6px var(--space-3);border-radius:var(--radius-md);border:1px solid var(--line-2);color:var(--text-2);font-weight:500;font-size:var(--text-sm);transition:all .15s;display:inline-flex;gap:6px;align-items:center}
.btn-ghost:hover{border-color:var(--accent);color:var(--text)}
/* main menu bar — icon + label button for moving between screens. Reads as a
   destination rather than a back-arrow, which is what the plain "X →" ghost
   links had become once the breadcrumb took over "back to the dashboard". */
.nav-btn{display:inline-flex;align-items:center;gap:7px;padding:6px var(--space-3);border-radius:var(--radius-md);border:1px solid var(--line-2);background:var(--panel);color:var(--text-2);font-size:var(--text-sm);font-weight:600;white-space:nowrap;text-decoration:none;transition:all .15s}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.nav-btn svg{flex-shrink:0}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#e0a43c,#c4763a);display:grid;place-items:center;font-size:var(--text-xs);font-weight:700;color:#fff;cursor:pointer}

/* ===================== Q&A =====================
   SPEC-qa-screen.md as simplified by DEC-116 (2026-10-06): one register, two
   views (Our questions / Other bidders), a status flagged by hand (To send /
   Sent / Answered, plus Answer to confirm after an import), answers shown on
   the question they answer. Questions arrive from Compliance as drafts
   (DEC-088) and hold nothing up (DEC-092). The export card, duplicate alert,
   exclude, progress tiles and arbitration queue are gone.
*/
.wrap{max-width:1080px;margin:0 auto;padding:var(--space-6) var(--space-6) 80px}
.scroll{flex:1;overflow-y:auto}
.view-head{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap}
.view-head h2{font-size:var(--text-lg);font-weight:600;letter-spacing:-.2px}
.view-head .sub{font-size:var(--text-sm);color:var(--text-3)}
/* the two tender dates, one quiet line — nothing renders when a date is unset */
.qa-dates{display:flex;gap:var(--space-5);flex-wrap:wrap;font-size:var(--text-sm);color:var(--text-3);margin:-6px 0 var(--space-4)}
.qa-dates b{color:var(--text-2);font-weight:600}
.qa-dates .late{color:var(--warn);font-weight:600}
.qa-bar{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-3)}
.qa-bar .sp{margin-left:auto;display:flex;gap:var(--space-2);align-items:center}
.qa-views{display:inline-flex;padding:3px;gap:2px;border-radius:var(--radius-md);background:var(--panel-3);flex-shrink:0}
.qa-views button{display:inline-flex;align-items:center;gap:var(--space-2);padding:6px var(--space-3);border-radius:var(--radius-sm);font-size:var(--text-base);font-weight:600;color:var(--text-2)}
.qa-views button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(14,30,50,.12)}
.qa-views .n{font-size:var(--text-xs);font-weight:700;padding:1px 7px;border-radius:var(--radius-pill);background:var(--panel-2);color:var(--text-2)}
.qa-views button.on .n{background:var(--accent-soft);color:var(--accent)}
.qa-search,.qa-select{background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--radius-md);padding:7px var(--space-3);font-size:var(--text-sm);color:var(--text)}
.qa-search{flex:1;min-width:200px;max-width:340px}
.qa-substrip{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;margin-bottom:var(--space-3);min-height:32px}
.qa-st-filter{display:flex;gap:6px;flex-wrap:wrap}
.qa-st-filter button{font-size:var(--text-sm);padding:4px var(--space-3);border-radius:var(--radius-pill);border:1px solid var(--line-2);color:var(--text-2);background:var(--panel)}
.qa-st-filter button span{font-weight:700;margin-left:2px}
.qa-st-filter button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.qa-st-filter button.is-confirm:not(.on){border-color:var(--human);color:var(--human)}
.qa-bulk{margin-left:auto;display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-sm);color:var(--text-2)}
.qa-link{font-size:var(--text-sm);color:var(--text-3);text-decoration:underline;text-underline-offset:2px}
.qa-link:hover{color:var(--text)}
.qa-substrip>.qa-link{margin-left:auto}
.qa-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-2);transition:border-color .15s}
.qa-card:hover{border-color:var(--line-2)}
.qa-card.is-sel{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.qa-top{display:flex;align-items:flex-start;gap:10px}
.qa-check,.qa-check-sp{width:15px;height:15px;margin:3px 0 0;flex-shrink:0;accent-color:var(--accent)}
.qa-id{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--accent);font-weight:600;padding-top:2px;flex-shrink:0}
.qa-q{flex:1;min-width:0;font-size:var(--text-base);line-height:1.5}
.qa-st{font-size:var(--text-xs);font-weight:700;padding:2px var(--space-2);border-radius:var(--radius-pill);white-space:nowrap;flex-shrink:0;margin-top:1px}
.qa-st.st-draft{background:var(--panel-3);color:var(--text-2)}
.qa-st.st-sent{background:var(--accent-soft);color:var(--accent)}
.qa-st.st-answered{background:var(--ok-soft);color:var(--ok)}
.qa-st.st-confirm{background:var(--human-soft);color:var(--human)}
.qa-act{flex-shrink:0;font-size:var(--text-xs);font-weight:600;padding:3px var(--space-2);border-radius:var(--radius-sm);border:1px solid var(--accent);color:var(--accent);white-space:nowrap}
.qa-act:hover{background:var(--accent-soft)}
.qa-act.quiet{border-color:var(--line-2);color:var(--text-3)}
.qa-act.quiet:hover{background:none;color:var(--text);border-color:var(--text-3)}
.qa-meta{display:flex;gap:var(--space-3);align-items:center;margin-top:var(--space-2);padding-left:25px;font-size:var(--text-xs);color:var(--text-3);flex-wrap:wrap}
.qa-card.is-other .qa-meta{padding-left:0}
.qa-req{font-family:var(--font-mono);font-size:var(--text-xs);padding:2px var(--space-2);border-radius:var(--radius-sm);background:var(--panel-3);color:var(--text-2);white-space:nowrap;flex-shrink:0}
.qa-noreq{font-size:var(--text-xs);color:var(--text-3);font-style:italic;white-space:nowrap;flex-shrink:0;padding-top:2px}
.qa-ans,.qa-suggest{margin:var(--space-2) 0 0 25px;padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);font-size:var(--text-sm);color:var(--text-2);line-height:1.5}
.qa-ans{background:var(--ok-soft);border:1px solid color-mix(in srgb, var(--ok) 25%, transparent)}
.qa-card.is-other .qa-ans{margin-left:0}
.qa-ans b,.qa-suggest b{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:3px}
.qa-ans b{color:var(--ok)}
.qa-suggest{background:var(--human-soft);border:1px dashed var(--human)}
.qa-suggest b{color:var(--human)}
.qa-suggest-act{display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-2)}
.qa-count{font-size:var(--text-sm);color:var(--text-3);margin-bottom:var(--space-3)}
.qa-empty{font-size:var(--text-sm);color:var(--text-3);padding:var(--space-6) 0;text-align:center}
.qa-empty-t{font-size:var(--text-lg);font-weight:600;color:var(--text);margin-bottom:var(--space-2)}
.qa-empty.big{max-width:520px;margin:var(--space-6) auto;line-height:1.55}
.qa-spin{width:13px;height:13px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:qaspin .7s linear infinite;flex-shrink:0}
@keyframes qaspin{to{transform:rotate(360deg)}}
#toast-zone{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:var(--space-2);align-items:center}
.toast{display:flex;align-items:center;gap:var(--space-3);background:var(--panel-3);border:1px solid var(--line-2);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);font-size:var(--text-base);box-shadow:0 8px 32px rgba(0,0,0,.35)}
.toast .t-ok{color:var(--ok)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- brand touches (22 Sept 2026) ---------------------------------------
   Titles take the heading face. The red is DECORATIVE ONLY: a small mark
   ahead of page titles — never on anything clickable or stateful,

   control would read as an error. Exact brand red still to be confirmed. */

/* TICKETS-prototype-batch6.md "Prepare the login for SSO" — identity now comes
   from the shell's directory-shaped getCurrentUser(), not typed into each
   screen's own markup (every screen had "Thibaud Breton"/"TB" hardcoded
   independently — six copies, no source of truth). No real SSO integration —
   prototype-level, per the ticket — but the screens now assume an identity
   handed to them. Standalone file:// open (no parent) keeps the same default
   so a screen still renders sensibly opened on its own, consistent with how
   CURRENT_PROJECT already falls back elsewhere in these files. */
(function(){
  try{
    const u=(window.parent!==window && window.parent.getCurrentUser) ? window.parent.getCurrentUser() : {name:"Thibaud Breton",title:"Bid Director",init:"TB"};
    const av=document.getElementById("header-avatar");
    if(av){ av.textContent=u.init; av.title=u.title?`${u.name} — ${u.title}`:u.name; }
  }catch(e){}
})();
/* the breadcrumb names the open tender, as on Risks — the static text in the
   markup is the fallback when the screen is opened on its own */
(function(){ try{ const p=window.parent.getCurrentProject(); const el=document.querySelector(".crumb .project"); if(p&&el) el.textContent=p.ref+" · "+p.name; }catch(e){} })();
/* Own copy of the demo story, per the convention every screen here follows.

   Awaiting Q&A is progress information in compliance.html and no longer
   blocks anything (DEC-092). */
/* DEC-032 — same 16-code system list as revue-documentaire.html's TYPO /
   compliance.html's TYPOS, replacing this screen's own invented 5-way split.
   label intentionally equals code — no real legend for these exists yet. */
const TYPOS={afc:{code:"AFC",label:"AFC"},cjv:{code:"CJV",label:"CJV"},com:{code:"COM",label:"COM"},cyb:{code:"CYB",label:"CYB"},deq:{code:"DEQ",label:"DEQ"},ils:{code:"ILS",label:"ILS"},ocs:{code:"OCS",label:"OCS"},pos:{code:"POS",label:"POS"},psd:{code:"PSD",label:"PSD"},rams:{code:"RAMS",label:"RAMS"},rst:{code:"RST",label:"RST"},scada:{code:"SCADA",label:"SCADA"},sen:{code:"SEN",label:"SEN"},sig:{code:"SIG",label:"SIG"},spm:{code:"SPM",label:"SPM"},trk:{code:"TRK",label:"TRK"}};
const TY=id=>TYPOS[id]||{code:String(id||"—").toUpperCase(),label:id||"—"};
let QA=[
  {id:"QA-01",st:"sent",q:"For history queries, is the one-year depth measured over a rolling year or a calendar year (P95 commitment)?",
   refs:[{req:"SRM-00010",typology:"trk"}],from:"Karim Benali",date:"Jul 14"},
  {id:"QA-02",st:"draft",q:"Please confirm the required retention period for audit logs — the STB states 3 years while the applicable group policy states 5 years.",
   refs:[{req:"SRM-00013",typology:"trk"}],from:"Claire Moreau",date:"Jul 15"},
  {id:"QA-03",st:"draft",q:"Which TLS version applies to legacy site gateways?",
   refs:[{req:"SRM-00014",typology:"sig"}],from:"Claire Moreau",date:"Jul 16"},
  {id:"QA-04",st:"draft",q:"Is TLS 1.3 mandatory for gateways already deployed on existing sites?",
   refs:[{req:"SRM-00012",typology:"sig"}],from:"Claire Moreau",date:"Jul 16"},
  {id:"QA-05",st:"answered",q:"Does the escalation matrix referenced in the alerting requirement come from the issuer or the contractor?",
   refs:[{req:"SRM-00005",typology:"sig"}],from:"Sophie Lang",date:"Jul 10",
   ans:"The escalation matrix will be provided by the issuer at contract award (Annex F).",ansDate:"Jul 13"},
];
/* §3bis — two optional tender-level dates. Static display strings, not live
   date math (no other screen in this prototype computes a real countdown
   either — the dashboard's "23 days to submission" is the same convention).
   Set either to null to see the "degrades cleanly" behaviour: no framing, no
   placeholder, nothing shown at all. They sit on the tender's own calendar
   (DEC-117 — on STB-2026, the dashboard's Statistics › Project timeline shows
   the same two dates): today is Jul 20, submission Aug 12, so the cut-off has
   passed — the don't-hard-block state — and the client's answers are due in
   four days. They used to read Aug 22 / Aug 24, after the submission itself. */
const TENDER_QA_DATES={
  questionCutoff:{date:"Jul 17, 2026", passed:true},
  expectedAnswerBy:{date:"Jul 24, 2026", overdue:false},
};
const state={view:"ours",status:"all",qSearch:"",qActivity:"",sel:new Set(),importing:false};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const refsLabel=q=>q.refs.map(r=>`${r.req}${r.typology?` · ${TY(r.typology).label}`:""}`).join(", ");
/* A question's status, as the register shows it: To send, Sent, Answered —
   and "Answer to confirm" while an imported answer probably answers it. */
const stOf=q=>q.st==="sent"&&q.suggest?"confirm":q.st;
/* DEC-116 — the flags and the import outlive the screen (every route reloads
   it): kept in the shell, per tender, like Compliance's drafts. */
const PID=(()=>{ try{ return window.parent.getCurrentProject().id; }catch(e){ return "_"; } })();
const REG=(()=>{ try{ return window.parent.getQaRegister(PID); }catch(e){ return null; } })()||{};
REG.flags=REG.flags||{};
function saveFlag(q){
  REG.flags[q.id]={st:q.st,sentDate:q.sentDate,ans:q.ans,ansDate:q.ansDate,suggest:q.suggest||null};
  // Keep the shell's copy in step (read back by pullSharedQuestions here and by Compliance's pullQaRegister)
  try{ const sq=(window.parent.getQuestions(PID)||[]).find(x=>x.id===q.id); if(sq){ sq.st=q.st; sq.ans=q.ans; } }catch(e){}
}

/* What the register knows is waiting on the project manager. */
function notifItems(){
  const out=[], n=k=>QA.filter(q=>stOf(q)===k).length;
  const c=n("confirm"), d=n("draft"), s=n("sent");
  const go=st=>()=>{ state.view="ours"; state.status=st; render(); };
  if(c) out.push({c:"var(--human)", t:`<b>${c} answer${c>1?"s":""}</b> to confirm`, time:"from the client's dossier", go:go("confirm")});
  if(d) out.push({c:"var(--text-3)", t:`<b>${d} question${d>1?"s":""}</b> to send`, time:"mark them as sent once they're out", go:go("draft")});
  if(s) out.push({c:"var(--accent)", t:`<b>${s} question${s>1?"s":""}</b> sent, no answer yet`, time:"awaiting the client", go:go("sent")});
  return out;
}

/* ---- notification bell ------------------------------------------------------
   Shared shape across screens, screen-specific content: notifItems() returns
   what THIS screen knows is waiting, read off its own data. */
function renderNotifDrop(){
  const drop=document.getElementById("notif-drop"); if(!drop) return;
  /* notifItems() reads this screen's live state, so a bad read must not take
     the screen down with it — the bell is the least important thing here. */
  let items=[]; try{ items=notifItems()||[]; }catch(e){ items=[]; }
  const btn=document.getElementById("notif-btn");
  const dot=btn&&btn.querySelector(".badge-dot");
  if(dot) dot.style.display=items.length?"":"none";
  drop.innerHTML=`<div class="nd-head">Notifications${items.length?` \u00b7 ${items.length}`:""}</div>`
    + (items.length
      ? items.map((it,i)=>`<button class="nd-item" data-nd="${i}"><span class="nd-dot" style="background:${it.c||"var(--accent)"}"></span><span><span class="nd-text">${it.t}</span><div class="nd-time">${it.time||""}</div></span></button>`).join("")
      : `<div class="nd-empty">Nothing waiting on you here.</div>`);
  drop.querySelectorAll("[data-nd]").forEach(el=>el.addEventListener("click",()=>{
    drop.classList.remove("open");
    const it=items[+el.dataset.nd]; if(it&&it.go) it.go();
  }));
}
(function wireBell(){
  const btn=document.getElementById("notif-btn"), drop=document.getElementById("notif-drop");
  if(!btn||!drop) return;
  /* Rendered on open, never at wire time: this block runs wherever it sits in
     the file, and the state notifItems() reads is declared with const further
     down — calling it here threw on the temporal dead zone and took the rest
     of the script with it. Lazy also means the list is never stale. */
  btn.addEventListener("click",e=>{ e.stopPropagation(); renderNotifDrop(); drop.classList.toggle("open"); });
  document.addEventListener("click",e=>{ if(!drop.contains(e.target)&&!btn.contains(e.target)) drop.classList.remove("open"); });
})();

function toast(msg,kind="ok"){
  const z=document.getElementById("toast-zone"),t=document.createElement("div");
  t.className="toast";
  t.innerHTML=`<span class="${kind==="ok"?"t-ok":""}" style="${kind==="warn"?"color:var(--warn)":""}">${kind==="ok"?"✓":"⚠"}</span><span>${msg}</span>`;
  z.appendChild(t);
  setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .3s";setTimeout(()=>t.remove(),300)},3600);
}
/* Re-render a container without losing focus/cursor position in whatever
   input triggered it — every filter here re-renders its whole panel on
   every keystroke, same pattern dashboard-et-config.html's roster search
   already uses, but that one gets away with it because the input sits
   outside the re-rendered node. These don't, so this restores it by hand. */
function preserveFocus(fn){
  const active=document.activeElement;
  const id=active&&active.id, s=active&&active.selectionStart, e=active&&active.selectionEnd;
  fn();
  if(!id) return;
  const el=document.getElementById(id);
  if(el&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA")){ el.focus(); if(s!=null){ try{ el.setSelectionRange(s,e); }catch(err){} } }
}
/* §3bis — the two tender dates on one quiet line; an unset date shows nothing. */
function datesHTML(){
  const c=TENDER_QA_DATES.questionCutoff, a=TENDER_QA_DATES.expectedAnswerBy, parts=[];
  if(c) parts.push(`<span><i class=ic-hourglass></i> Question cut-off <b>${c.date}</b>${c.passed?` — <span class="late">passed</span>`:""}</span>`);
  if(a) parts.push(`<span><i class=ic-clock></i> Answers expected by <b>${a.date}</b>${a.overdue?` — <span class="late">overdue</span>`:""}</span>`);
  return parts.length?`<div class="qa-dates">${parts.join("")}</div>`:"";
}

/* ---------- Our questions ---------- */
const ST_ORDER={confirm:0,draft:1,sent:2,answered:3};
function oursHTML(){
  const counts={all:QA.length,draft:0,sent:0,confirm:0,answered:0};
  QA.forEach(q=>counts[stOf(q)]++);
  if(state.status==="confirm"&&!counts.confirm) state.status="all";
  const chips=[["all","All"],["draft","To send"],["sent","Sent"],["confirm","Answer to confirm"],["answered","Answered"]].filter(([k])=>k!=="confirm"||counts.confirm);
  const q=state.qSearch.toLowerCase(), act=state.qActivity;
  let rows=QA.filter(x=>state.status==="all"||stOf(x)===state.status);
  if(act) rows=rows.filter(x=>x.refs.some(r=>r.typology===act));
  if(q) rows=rows.filter(x=>x.q.toLowerCase().includes(q)||x.id.toLowerCase().includes(q)||x.refs.some(r=>r.req.toLowerCase().includes(q)));
  rows.sort((a,b)=>ST_ORDER[stOf(a)]-ST_ORDER[stOf(b)]);
  [...state.sel].forEach(id=>{ if(!QA.some(x=>x.id===id&&x.st==="draft")) state.sel.delete(id); });
  state.visibleDrafts=rows.filter(x=>x.st==="draft").map(x=>x.id);
  const nSel=state.sel.size;
  let h=`<div class="qa-substrip">
    <div class="qa-st-filter">${chips.map(([k,l])=>`<button data-st="${k}" class="${state.status===k?"on":""}${k==="confirm"?" is-confirm":""}">${l} <span>${counts[k]}</span></button>`).join("")}</div>
    ${nSel?`<div class="qa-bulk"><span><b>${nSel}</b> selected</span><button class="btn-primary" id="bulk-sent">Mark as sent</button><button class="qa-link" id="bulk-clear">Clear</button></div>`
      :state.visibleDrafts.length>1?`<button class="qa-link" id="sel-all">Select the ${state.visibleDrafts.length} to send</button>`:""}
  </div>`;
  if(!rows.length) return h+`<div class="qa-empty">${QA.length?"No question matches.":"No question yet — they are raised from Compliance, on an assignment."}</div>`;
  return h+rows.map(cardHTML).join("");
}
function cardHTML(q){
  const st=stOf(q);
  const lbl= st==="draft"?"To send"
    : st==="sent"?`Sent${q.sentDate?` · ${q.sentDate}`:""}`
    : st==="answered"?`Answered${q.ansDate?` · ${q.ansDate}`:""}`
    : "Answer to confirm";
  return `<div class="qa-card${state.sel.has(q.id)?" is-sel":""}">
    <div class="qa-top">
      ${q.st==="draft"?`<input type="checkbox" class="qa-check" data-sel="${q.id}" ${state.sel.has(q.id)?"checked":""} title="Select it to mark several as sent at once">`:`<span class="qa-check-sp"></span>`}
      <span class="qa-id">${q.id}</span><span class="qa-q">${esc(q.q)}</span>
      <span class="qa-st st-${st}">${lbl}</span>
      ${q.st==="draft"?`<button class="qa-act" data-sent="${q.id}" title="It has gone to the client — the tool doesn't send anything itself">Mark as sent</button>`:""}
      ${q.st==="sent"&&!q.suggest?`<button class="qa-act quiet" data-unsent="${q.id}" title="Back to the questions to send">Not sent</button>`:""}
    </div>
    <div class="qa-meta">${q.refs.map(r=>`<span class="qa-req">${r.req}</span>${r.typology?`<span>${esc(TY(r.typology).label)}</span>`:""}`).join("")}
      <span>raised by ${esc(q.from)} · ${q.date}${q.origin==="compliance"?" · from Compliance":""}</span></div>
    ${q.ans?`<div class="qa-ans"><b>Client's answer${q.ansDate?` · ${q.ansDate}`:""}</b>${esc(q.ans)}</div>`:""}
    ${q.suggest?`<div class="qa-suggest"><b>Probably the client's answer — ${q.suggest.conf}% sure it answers this question</b>${esc(q.suggest.text)}
      <div class="qa-suggest-act"><button class="btn-primary" data-confirm="${q.id}">✓ It's the answer</button><button class="qa-link" data-reject="${q.id}">Not this one</button></div></div>`:""}
  </div>`;
}

/* ---------- Other bidders ----------
   The client's dossier holds every bidder's questions and answers; ours go
   onto our questions, the rest is listed here, read-only, with the
   requirement it concerns when the import could tell. */
function othersHTML(){
  const all=REG.others;
  if(!all) return `<div class="qa-empty big"><div class="qa-empty-t">Nothing imported yet</div>
    The client's Q&amp;A dossier holds every bidder's questions with their answers. Import it: the answers to our questions go onto them, and everyone else's are listed here.
    <div style="margin-top:var(--space-4)"><button class="btn-primary" id="import-btn2" ${state.importing?"disabled":""}>${state.importing?`<span class="qa-spin"></span> Importing…`:`<i class=ic-upload></i> Import the client's answers`}</button></div></div>`;
  const q=state.qSearch.toLowerCase();
  const rows=q?all.filter(o=>o.q.toLowerCase().includes(q)||o.a.toLowerCase().includes(q)||(o.req||"").toLowerCase().includes(q)):all;
  if(!rows.length) return `<div class="qa-empty">No question or answer matches.</div>`;
  return `<div class="qa-count">${rows.length} question${rows.length>1?"s":""} asked by other bidders, with the client's answer — published to every bidder</div>`
    +rows.map(o=>`<div class="qa-card is-other">
      <div class="qa-top"><span class="qa-q">${esc(o.q)}</span>${o.req
        ?`<span class="qa-req" title="The requirement it concerns">${o.req}</span>`
        :`<span class="qa-noreq" title="The import couldn't tell which requirement this concerns">No requirement linked</span>`}</div>
      <div class="qa-ans"><b>Client's answer</b>${esc(o.a)}</div>
    </div>`).join("");
}

/* ---------- import ----------
   Simulated: the real step reads the dossier in whatever layout the client
   used. Our sent questions get their answer; one the matching is unsure of
   waits on the question as "to confirm" — no arbitration queue (DEC-116). */
const ANSWERS_OURS={
  "QA-01":"A rolling year: the one-year depth counts back from the date of the query.",
  "QA-02":"Five years — the group policy applies; the STB will be corrected in the next issue.",
  "QA-03":"TLS 1.2 is accepted on legacy gateways until their replacement; TLS 1.3 for every new one.",
  "QA-04":"No — gateways already deployed keep TLS 1.2 until they are replaced.",
};
const OTHER_QA=[
  ["Please confirm the minimum bending radius accepted for trackside cable routing.","Ten times the cable's outer diameter, as per the cabling standard in Annex C."],
  ["Is the SIL4 requirement applicable to the whole interlocking or only the core safety logic?","To the core safety logic only; the maintenance terminal is SIL0."],
  ["Clarify whether redundant power feeds are mandatory at every substation or only the main ones.","Only at the main substations listed in Table 5."],
  ["What is the expected MTBF for platform screen door actuators?","At least 150,000 hours, measured over the first two years of operation."],
  ["Does the monitoring platform need to support IPv6 for all field devices?","IPv6 support is required for new devices; existing ones may stay on IPv4."],
  ["Confirm whether the historian must retain raw telemetry or only aggregated values.","Raw telemetry for 90 days, aggregated values for the full retention period."],
  ["Is a third-party SOC integration mandatory, or can the bidder propose its own?","The bidder may propose its own SOC, subject to the client's approval."],
  ["What certification is required for the traction power SCADA link?","IEC 62443-3-3 SL2, certified by an accredited body."],
  ["Please clarify the acceptance test duration for the signalling interlocking.","Six weeks of trial running without a safety-related failure."],
  ["Is remote firmware update over the operational network permitted for field controllers?","Yes, signed updates only, within the maintenance windows."],
  ["Confirm the expected availability target (%) for the central monitoring platform.","99.95 % over a rolling twelve months."],
  ["Does the alerting requirement cover planned maintenance windows or only unplanned events?","Unplanned events only; planned windows are announced to operators separately."],
  ["What language(s) must the operator console support at handover?","English and the local language; the training material in both."],
  ["Is a digital twin of the signalling layout part of the expected deliverable?","No, it is not part of the scope."],
  ["Please confirm whether cybersecurity logging must comply with IEC 62443 SL2 or SL3.","SL2 for field devices, SL3 for the central systems."],
];
const REQ_POOL=["SRM-00002","SRM-00003","SRM-00006","SRM-00007","SRM-00008","SRM-00009","SRM-00011","SRM-00015","SRM-00018","SRM-00021","SRM-00024","SRM-00027","SRM-00030","SRM-00033","SRM-00036","SRM-00039"];
function runImport(){
  if(state.importing) return;
  state.importing=true; render();
  setTimeout(()=>{
    const first=!REG.others; let answered=0, toConfirm=0;
    QA.filter(q=>q.st==="sent"&&!q.suggest).forEach((q,i)=>{
      const text=ANSWERS_OURS[q.id]||`Confirmed as specified in the STB — see the clause behind ${q.refs[0]?q.refs[0].req:"this requirement"}.`;
      if(first&&i===0){ q.suggest={text,conf:63}; toConfirm++; }
      else { q.st="answered"; q.ans=text; q.ansDate="Today"; answered++; }
      saveFlag(q);
    });
    // deterministic spread, not Math.random: the same items stay unlinked from one run to the next
    REG.others=OTHER_QA.map(([qq,a],i)=>({id:"OB-"+(i+1), q:qq, a, req:((i*0.61803398875)%1)<0.25?null:REQ_POOL[(i*7)%REQ_POOL.length]}));
    state.importing=false;
    toast(`Client's answers imported — ${answered} of our questions answered${toConfirm?`, ${toConfirm} to confirm`:""}, ${REG.others.length} from other bidders`, toConfirm?"warn":"ok");
    render();
  },900);
}

/* ---------- the screen ---------- */
function render(){
  const root=document.getElementById("qa-root");
  const nOthers=(REG.others||[]).length;
  root.innerHTML=datesHTML()+`
    <div class="qa-bar">
      <div class="qa-views" role="tablist">
        <button data-view="ours" class="${state.view==="ours"?"on":""}">Our questions <span class="n">${QA.length}</span></button>
        <button data-view="others" class="${state.view==="others"?"on":""}" ${REG.others?"":`title="Not imported yet"`}>Other bidders <span class="n">${REG.others?nOthers:"—"}</span></button>
      </div>
      <input id="q-search" class="qa-search" value="${esc(state.qSearch)}" autocomplete="off"
        placeholder="${state.view==="ours"?"Search a question or a requirement ID…":"Search their questions and answers…"}">
      ${state.view==="ours"?`<select id="q-activity" class="qa-select"><option value="">All systems</option>${Object.keys(TYPOS).map(k=>`<option value="${k}">${TY(k).label}</option>`).join("")}</select>`:""}
      <div class="sp">
        ${state.view==="ours"?`<button class="btn-ghost" id="export-xls" title="An Excel file of the questions still to send, one row each with its requirement ID — sending stays yours, and so does marking them as sent"><i class=ic-download></i> Export to Excel</button>`:""}
        <button class="btn-ghost" id="import-btn" ${state.importing?"disabled":""}>${state.importing?`<span class="qa-spin"></span> Importing…`:`<i class=ic-upload></i> Import the client's answers`}</button>
      </div>
    </div>
    ${state.view==="ours"?oursHTML():othersHTML()}`;
  bind(root);
  renderNotifDrop();
}
function markSent(ids){
  const done=ids.filter(id=>{ const q=QA.find(x=>x.id===id); if(!q||q.st!=="draft") return false; q.st="sent"; q.sentDate="Today"; saveFlag(q); state.sel.delete(id); return true; });
  if(done.length) toast(`${done.length===1?done[0]:done.length+" questions"} marked as sent`,"ok");
  render();
}
function bind(root){
  root.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{ state.view=b.dataset.view; state.qSearch=""; render(); }));
  root.querySelectorAll("[data-st]").forEach(b=>b.addEventListener("click",()=>{ state.status=b.dataset.st; render(); }));
  root.querySelector("#q-search").addEventListener("input",e=>{ state.qSearch=e.target.value; preserveFocus(render); });
  const act=root.querySelector("#q-activity");
  if(act){ act.value=state.qActivity; act.addEventListener("change",e=>{ state.qActivity=e.target.value; render(); }); }
  root.querySelectorAll("[data-sel]").forEach(c=>c.addEventListener("change",()=>{ c.checked?state.sel.add(c.dataset.sel):state.sel.delete(c.dataset.sel); render(); }));
  root.querySelector("#sel-all")?.addEventListener("click",()=>{ (state.visibleDrafts||[]).forEach(id=>state.sel.add(id)); render(); });
  root.querySelector("#bulk-sent")?.addEventListener("click",()=>markSent([...state.sel]));
  root.querySelector("#bulk-clear")?.addEventListener("click",()=>{ state.sel.clear(); render(); });
  root.querySelectorAll("[data-sent]").forEach(b=>b.addEventListener("click",()=>markSent([b.dataset.sent])));
  root.querySelectorAll("[data-unsent]").forEach(b=>b.addEventListener("click",()=>{
    const q=QA.find(x=>x.id===b.dataset.unsent); if(!q) return;
    q.st="draft"; delete q.sentDate; saveFlag(q); toast(`${q.id} back with the questions to send`,"ok"); render();
  }));
  root.querySelectorAll("[data-confirm]").forEach(b=>b.addEventListener("click",()=>{
    const q=QA.find(x=>x.id===b.dataset.confirm); if(!q||!q.suggest) return;
    q.st="answered"; q.ans=q.suggest.text; q.ansDate="Today"; delete q.suggest; saveFlag(q);
    toast(`${q.id} answered — ${esc(refsLabel(q))}`,"ok"); render();
  }));
  root.querySelectorAll("[data-reject]").forEach(b=>b.addEventListener("click",()=>{
    const q=QA.find(x=>x.id===b.dataset.reject); if(!q) return;
    delete q.suggest; saveFlag(q); toast(`${q.id} stays sent — still waiting for its answer`,"ok"); render();
  }));
  root.querySelector("#import-btn")?.addEventListener("click",runImport);
  root.querySelector("#import-btn2")?.addEventListener("click",runImport);
  root.querySelector("#export-xls")?.addEventListener("click",()=>{
    const n=QA.filter(q=>q.st==="draft").length;
    toast(n?`Excel with the ${n} question${n>1?"s":""} to send — mark them as sent once they're out`:"Nothing left to send",n?"ok":"warn");
  });
}
/* DEC-088 — questions raised on Compliance arrive here, to send with the rest;
   then each question takes back the status flagged on it earlier (DEC-116). */
(function pullSharedQuestions(){
  try{
    (window.parent.getQuestions(PID)||[]).forEach(q=>{
      if(!QA.some(x=>x.id===q.id)) QA.unshift({id:q.id, st:q.st||"draft", q:q.q, refs:(q.refs||[]).map(r=>({req:r.req, typology:r.typology||""})), from:q.from, date:q.date, origin:"compliance", ans:q.ans});
    });
  }catch(e){}
  QA.forEach(q=>{ const f=REG.flags[q.id]; if(!f) return; Object.assign(q,f); if(!q.suggest) delete q.suggest; });
})();
render();
</script>
</body>
</html>
