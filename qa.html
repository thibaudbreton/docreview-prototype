<style>
:root{
  --bg:#141F2B; --panel:#1E3246; --panel-2:#26374C; --panel-3:#2F4257;
  --line:#2C3E52; --line-2:#3A4E66;
  --text:#EEF1F8; --text-2:#AAB6C6; --text-3:#8B9AAD;
  --accent:#4C82FF; --accent-soft:#1E3A63; --accent-hover:color-mix(in srgb, var(--accent) 75%, white);
  --ia:#E3A64B; --ia-soft:rgba(227,166,75,.12);
  --ok:#3FBE86; --ok-soft:rgba(63,190,134,.12);
  --human:#a06ef2; --human-soft:rgba(160,110,242,.12);
  --warn:#F2604F; --warn-soft:rgba(242,96,79,.12);
  --paper:#fbfaf6; --paper-ink:#1d2129; --paper-ink-2:#4a5162;
  --text-xs:11px; --text-sm:12px; --text-base:13px; --text-lg:16px; --text-xl:21px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px;
  --radius-xs:4px; --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-pill:999px;
  --font-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-doc:Georgia,"Times New Roman",serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,monospace;
}

html[data-theme="light"]{
  --bg:#F4F5FA;
  --panel:#FFFFFF;
  --panel-2:#F4F5FA;
  --panel-3:#E6E6F0;
  --line:#E1E3EE;
  --line-2:#CDD2E3;
  --text:#1E3246;
  --text-2:#4A5A6E;
  --text-3:#637187;
  --accent:#0050E3;
  --accent-soft:#E9EFFD;
  --ia:#C67A16;
  --ia-soft:rgba(198,122,22,.12);
  --ok:#1E8E5A;
  --ok-soft:rgba(30,142,90,.12);
  --human:#8250dc;
  --human-soft:rgba(130,80,220,.12);
  --warn:#DC3223;
  --warn-soft:rgba(220,50,35,.10);
  --paper:#ffffff;
  --paper-ink:#1d2129;
  --paper-ink-2:#4a5162;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);font-size:var(--text-base);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:var(--radius-sm);border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius-xs)}
#app{display:flex;flex-direction:column;height:100vh}
main{display:flex;flex:1;min-height:0}

/* ---------- Header ---------- */
header{display:flex;align-items:center;gap:var(--space-4);height:52px;padding:0 var(--space-4);background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
.logo{display:flex;align-items:center;gap:var(--space-2);font-weight:700;font-size:var(--text-base);letter-spacing:-.2px}
.logo-mark{height:22px;width:auto;flex-shrink:0;display:block}
.logo-mark-light{display:none}
html[data-theme="light"] .logo-mark-dark{display:none}
html[data-theme="light"] .logo-mark-light{display:block}
.crumb{display:flex;align-items:center;gap:var(--space-2);color:var(--text-2);min-width:0}
.crumb .sep{color:var(--text-3)}
.crumb .project{color:var(--text);font-weight:600;white-space:nowrap;text-decoration:none;cursor:pointer;border-radius:var(--radius-xs);transition:color .15s}
.crumb .project:hover{color:var(--accent)}
.mode-switch{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-1);margin-left:auto}
.mode-switch button{padding:5px var(--space-4);border-radius:var(--radius-sm);color:var(--text-2);font-weight:500;font-size:var(--text-base);transition:all .15s;display:inline-flex;gap:6px;align-items:center}
.mode-switch button.active{background:var(--panel-3);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.mode-switch button:hover:not(.active){color:var(--text)}
.mode-switch .mcount{font-size:var(--text-xs);font-weight:700;padding:1px 6px;border-radius:var(--radius-lg);background:var(--accent-soft);color:var(--accent)}
.hdr-actions{display:flex;align-items:center;gap:8px}
.icon-btn{position:relative;width:32px;height:32px;border-radius:var(--radius-md);display:grid;place-items:center;color:var(--text-2);transition:all .15s}
.icon-btn:hover{background:var(--panel-3);color:var(--text)}
.badge-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--warn);border:2px solid var(--panel)}
.btn-primary{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-radius:var(--radius-md);background:var(--accent);color:#fff;font-weight:600;font-size:var(--text-base);transition:all .15s}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-ghost{padding:6px var(--space-3);border-radius:var(--radius-md);border:1px solid var(--line-2);color:var(--text-2);font-weight:500;font-size:var(--text-sm);transition:all .15s;display:inline-flex;gap:6px;align-items:center}
.btn-ghost:hover{border-color:var(--accent);color:var(--text)}
/* main menu bar — icon + label button for moving between screens. Reads as a
   destination rather than a back-arrow, which is what the plain "X →" ghost
   links had become once the breadcrumb took over "back to the dashboard". */
.nav-btn{display:inline-flex;align-items:center;gap:7px;padding:6px var(--space-3);border-radius:var(--radius-md);border:1px solid var(--line-2);background:var(--panel);color:var(--text-2);font-size:var(--text-sm);font-weight:600;white-space:nowrap;text-decoration:none;transition:all .15s}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.nav-btn svg{flex-shrink:0}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#e0a43c,#c4763a);display:grid;place-items:center;font-size:var(--text-xs);font-weight:700;color:#fff;cursor:pointer}

/* ---------- Triage ---------- */
.triage{display:flex;align-items:center;gap:var(--space-4);height:44px;padding:0 var(--space-4);background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}

/* ===================== Q&A =====================
   TICKET-three-support-screens.md — screen 3. Its own screen now, reached by a
   button, no longer a tab inside the Compliance step.

   Deliberately NOT redesigned: the ticket says the layout "hasn't been worked
   through" and is "worth its own pass rather than being derived from the list
   above". So this is the existing register and issuer-responses material moved
   across as-is, with its own copy of the demo data (the convention every screen
   here follows). What stays in compliance.html is the part that is genuinely
   compliance state: a branch sitting in Awaiting Q&A and blocking consolidation.
*/
.wrap{max-width:1080px;margin:0 auto;padding:var(--space-6) var(--space-6) 80px}
.scroll{flex:1;overflow-y:auto}
.view-head{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap}
.view-head h2{font-size:var(--text-lg);font-weight:600;letter-spacing:-.2px}
.view-head .sub{font-size:var(--text-sm);color:var(--text-3)}
.hub-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px}
.hub-tabs button{padding:10px var(--space-4);font-size:var(--text-base);font-weight:500;color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:var(--space-2);align-items:center}
.hub-tabs button.active{color:var(--text);border-bottom-color:var(--accent)}
.hub-tabs .tcount{font-size:var(--text-xs);font-weight:700;padding:1px 6px;border-radius:var(--radius-lg);background:var(--warn-soft);color:var(--warn)}
.vpill{display:inline-flex;align-items:center;gap:6px;padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);font-size:var(--text-xs);font-weight:700;white-space:nowrap}
.vpill.compliant{background:var(--ok-soft);color:var(--ok)}
.vpill.not_compliant{background:var(--warn-soft);color:var(--warn)}
.vpill.none{color:var(--text-3)}
/* pending is NOT a verdict — dashed outline, muted, italic, never reads as decided */
.vpill.pending-pill{border:1px dashed var(--line-2);color:var(--text-3);font-style:italic;font-weight:500;background:transparent}
.flag-out{display:inline-flex;font-size:var(--text-xs);font-weight:700;padding:1px var(--space-2);border-radius:var(--radius-lg);background:var(--ia-soft);color:var(--ia);margin-left:6px;white-space:nowrap}
.qa-toolbar{display:flex;align-items:center;gap:var(--space-3);margin-bottom:14px}
.qa-group{margin-bottom:22px}
.qa-group-head{font-size:var(--text-xs);font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);margin-bottom:var(--space-2);display:flex;gap:var(--space-2);align-items:center}
.qa-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-2);transition:border-color .15s}
.qa-card:hover{border-color:var(--line-2)}
.qa-top{display:flex;align-items:flex-start;gap:10px}
.qa-id{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--accent);font-weight:600;padding-top:2px}
.qa-q{flex:1;font-size:var(--text-base);line-height:1.5}
.qa-meta{display:flex;gap:var(--space-3);align-items:center;margin-top:var(--space-2);font-size:var(--text-xs);color:var(--text-3);flex-wrap:wrap}
.qa-req{font-family:var(--font-mono);font-size:var(--text-xs);padding:2px var(--space-2);border-radius:var(--radius-sm);background:var(--panel-3);color:var(--text-2)}
.qa-ans{margin-top:var(--space-2);padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);background:var(--ok-soft);font-size:var(--text-sm);color:var(--text-2);border:1px solid rgba(63,178,127,.25)}
.qa-ans b{color:var(--ok);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:3px}
.dedup{border:1px dashed rgba(224,164,60,.55);background:var(--ia-soft);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);margin-bottom:12px}
.dedup .ia-head{display:flex;gap:6px;font-size:var(--text-xs);font-weight:700;color:var(--ia);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.dedup p{font-size:var(--text-sm);color:var(--text-2);line-height:1.5;margin-bottom:10px}
.dedup p b{color:var(--text)}
.dedup .actions{display:flex;gap:6px}
.dedup .accept{padding:6px var(--space-4);border-radius:var(--radius-sm);background:var(--ok);color:#fff;font-weight:600;font-size:var(--text-sm)}
.dedup .reject{padding:6px var(--space-3);border-radius:var(--radius-sm);border:1px solid var(--line-2);color:var(--text-2);font-size:var(--text-sm)}
/* T7 — manager's outbound batch */
.qa-batch{border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4);background:var(--panel-2)}
.qa-batch-h{font-size:var(--text-sm);font-weight:700;color:var(--text);display:flex;align-items:center;gap:var(--space-2);margin-bottom:8px}
.qa-batch-n{font-size:var(--text-xs);font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:var(--radius-lg);padding:1px 8px}
.qa-batch-empty{font-size:var(--text-sm);color:var(--text-3);font-style:italic}
.qa-batch-list{display:flex;flex-direction:column;gap:6px}
.qa-batch-item{display:flex;align-items:center;gap:var(--space-3);font-size:var(--text-sm);padding:var(--space-2) var(--space-2);border-radius:var(--radius-md);background:var(--panel)}
.qa-batch-q{flex:1;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qa-batch-src{color:var(--text-3);white-space:nowrap;font-size:var(--text-xs)}
.qa-batch-st{font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--accent);white-space:nowrap}
.qa-batch-st.orphan{color:var(--text-3)}
/* T8 — inbound dossier + matching result */
.qa-upload{border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4);background:var(--panel-2)}
.qa-upload-h{font-size:var(--text-sm);font-weight:700;color:var(--text);margin-bottom:5px}
.qa-upload-t{font-size:var(--text-sm);color:var(--text-3);line-height:1.5;margin-bottom:10px}
.qa-upload-row{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.qa-match{margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--line)}
.qa-match-h{font-size:var(--text-sm);font-weight:700;color:var(--ok);margin-bottom:8px}
.qa-match-row{display:flex;align-items:center;gap:var(--space-3);font-size:var(--text-sm);padding:6px 0;color:var(--text-2)}
.qa-match-ok{color:var(--ok);font-weight:600;margin-left:auto}
.iss-layout{display:grid;grid-template-columns:1fr 340px;gap:var(--space-5);align-items:start}
.iss-row{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-2);cursor:pointer;transition:border-color .15s}
.iss-row:hover{border-color:var(--line-2)}
.iss-row.active{border-color:var(--accent);background:var(--accent-soft)}
.iss-row.flagged{border-style:dashed;border-color:rgba(229,84,75,.55)}
.iss-top{display:flex;gap:var(--space-3);align-items:flex-start}
.iss-q{flex:1;font-size:var(--text-base);line-height:1.5}
.iss-meta{display:flex;gap:var(--space-3);margin-top:var(--space-2);font-size:var(--text-xs);color:var(--text-3);align-items:center;flex-wrap:wrap}
.iss-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-4);position:sticky;top:0}
.iss-panel h3{font-size:var(--text-base);font-weight:600;margin-bottom:12px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="toast-zone"></div>
<script>
/* Own copy of the demo story, per the convention every screen here follows.
   Requirement links are plain refs — this screen shows and answers questions;
   the consolidation-blocking side of Awaiting Q&A stays in compliance.html. */
const TYPOS={sig:{code:"SIG",label:"SIG & Urban"},mln:{code:"MLN",label:"Mainline Wayside"},sys:{code:"SYS",label:"Safety"},tlc:{code:"TLC",label:"Telecom"},inf:{code:"INF",label:"Infrastructure"}};
const TY=id=>TYPOS[id]||{code:String(id||"—").toUpperCase(),label:id||"—"};
let QA=[
  {id:"QA-01",st:"sent",q:"For history queries, is the one-year depth measured over a rolling year or a calendar year (P95 commitment)?",
   refs:[{req:"SRM-00010",typology:"mln"}],from:"Karim Benali",date:"Jul 14"},
  {id:"QA-02",st:"internal",q:"Please confirm the required retention period for audit logs — the STB states 3 years while the applicable group policy states 5 years.",
   refs:[{req:"SRM-00013",typology:"mln"}],from:"Claire Moreau",date:"Jul 15"},
  {id:"QA-03",st:"draft",q:"Which TLS version applies to legacy site gateways?",
   refs:[{req:"SRM-00014",typology:"sig"}],from:"Claire Moreau",date:"Jul 16",dup:"QA-04"},
  {id:"QA-04",st:"draft",q:"Is TLS 1.3 mandatory for gateways already deployed on existing sites?",
   refs:[{req:"SRM-00012",typology:"sig"}],from:"Claire Moreau",date:"Jul 16",dup:"QA-03"},
  {id:"QA-05",st:"answered",q:"Does the escalation matrix referenced in the alerting requirement come from the issuer or the contractor?",
   refs:[{req:"SRM-00005",typology:"sig"}],from:"Sophie Lang",date:"Jul 10",
   ans:"The escalation matrix will be provided by the issuer at contract award (Annex F).",ansDate:"Jul 13"},
];
const state={htab:"register",selQ:null,imported:false};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const questionsToSend=()=>QA.filter(q=>q.st==="draft"||q.st==="internal");
const questionsSent=()=>QA.filter(q=>q.st==="sent");
const refsLabel=q=>q.refs.map(r=>`${r.req} · ${TY(r.typology).label}`).join(", ");
function toast(msg,kind="ok"){
  const z=document.getElementById("toast-zone"),t=document.createElement("div");
  t.className="toast";
  t.innerHTML=`<span class="${kind==="ok"?"t-ok":""}" style="${kind==="warn"?"color:var(--warn)":""}">${kind==="ok"?"✓":"⚠"}</span><span>${msg}</span>`;
  z.appendChild(t);
  setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .3s";setTimeout(()=>t.remove(),300)},3600);
}

/* ---------- register ---------- */
function renderRegister(){
  const v=document.getElementById("htab-register");
  const toSend=questionsToSend();
  const dupPair=QA.filter(q=>q.dup&&QA.find(x=>x.id===q.dup));
  let html=`<div class="view-head" style="margin-bottom:14px"><h2 style="font-size:var(--text-base)">${QA.length} questions</h2>
    <span class="sub">One question blocks exactly one assignment</span>
    <button class="btn-primary" style="margin-left:auto" id="send-batch">⬇ Export batch for issuer${toSend.length?` (${toSend.length})`:""}</button></div>`;
  // Questions are exported, not sent — the tool has no channel to the issuer.
  html+=`<div class="qa-batch">
    <div class="qa-batch-h">⬇ Questions to export <span class="qa-batch-n">${toSend.length}</span></div>
    ${toSend.length
      ? `<div class="qa-batch-list">${toSend.map(q=>`<div class="qa-batch-item">
          <span class="qa-id">${q.id}</span>
          <span class="qa-batch-q">${esc(q.q)}</span>
          <span class="qa-batch-src">${esc(q.from)} · ${esc(refsLabel(q))}</span>
          <span class="qa-batch-st${q.st==="draft"?" orphan":""}">${q.st==="draft"?"Draft":"In review"}</span>
        </div>`).join("")}</div>`
      : `<div class="qa-batch-empty">Nothing waiting to be exported.</div>`}
  </div>`;
  if(dupPair.length>=2){
    html+=`<div class="qa-upload"><div class="qa-upload-h">⚠ Possible duplicate detected</div>
      <div class="qa-upload-t">${dupPair.map(q=>`<b>${q.id}</b>`).join(" and ")} look like the same question to the issuer. Merge before exporting so the client gets one, not two.</div>
      <div class="qa-upload-row"><button class="btn-ghost" id="merge-dup">⇲ Merge into ${dupPair[0].id}</button></div></div>`;
  }
  const groups=[["draft","Drafts"],["internal","Internal review"],["sent","Sent to the issuer"],["answered","Answered"]];
  groups.forEach(([st,label])=>{
    const rows=QA.filter(q=>q.st===st);
    if(!rows.length) return;
    html+=`<div class="qa-group"><div class="qa-group-head">${label} <span class="qa-batch-n">${rows.length}</span></div>
      ${rows.map(q=>`<div class="qa-card">
        <div class="qa-top"><span class="qa-id">${q.id}</span><span class="qa-q">${esc(q.q)}</span></div>
        <div class="qa-meta">${q.refs.map(r=>`<span class="qa-req">${r.req}</span>`).join("")}
          <span>${esc(refsLabel(q))}</span><span>raised by ${esc(q.from)} · ${q.date}</span></div>
        ${q.ans?`<div class="qa-ans"><b>Issuer answer · ${q.ansDate}</b>${esc(q.ans)}</div>`:""}
      </div>`).join("")}</div>`;
  });
  v.innerHTML=html;
  v.querySelector("#send-batch").addEventListener("click",()=>{
    const batch=questionsToSend();
    if(!batch.length){ toast("Nothing to export","warn"); return; }
    batch.forEach(q=>{ q.st="sent"; q.date="Today"; });
    toast(`${batch.length} question${batch.length>1?"s":""} exported for the issuer — forward the file yourself`,"ok");
    renderAll();
  });
  v.querySelector("#merge-dup")?.addEventListener("click",()=>{
    const [keep,drop]=dupPair;
    keep.refs=[...keep.refs,...drop.refs];
    delete keep.dup;
    QA=QA.filter(q=>q.id!==drop.id);
    toast(`${drop.id} merged into ${keep.id} — one question to the issuer, both assignments attached`,"ok");
    renderAll();
  });
}

/* ---------- issuer responses ---------- */
function renderIssuer(){
  const list=document.getElementById("iss-list"); list.innerHTML="";
  const rows=QA.filter(q=>q.st==="sent"||q.st==="answered");
  document.getElementById("iss-count").textContent=QA.filter(q=>q.st==="sent").length;
  if(!rows.length){ list.innerHTML=`<div class="qa-batch-empty">No question has been exported yet.</div>`; }
  rows.forEach(q=>{
    const el=document.createElement("div");
    el.className="iss-row"+(state.selQ===q.id?" active":"")+(q.flagged?" flagged":"");
    el.innerHTML=`<div class="iss-top"><span class="qa-id">${q.id}</span><span class="iss-q">${esc(q.q)}</span></div>
      <div class="iss-meta">${q.refs.map(r=>`<span class="qa-req">${r.req}</span>`).join("")}
        <span>sent ${q.date}</span>
        ${q.st==="answered"?'<span class="vpill compliant">Answered · propagated</span>':'<span class="vpill none">Awaiting issuer</span>'}
        ${q.flagged?'<span class="flag-out">Uncertain match — confirm manually</span>':""}</div>
      ${q.ans?`<div class="qa-ans"><b>Issuer answer · ${q.ansDate}</b>${esc(q.ans)}</div>`:""}`;
    el.addEventListener("click",()=>{state.selQ=q.id;renderIssuer();});
    list.appendChild(el);
  });
  const panel=document.getElementById("iss-panel");
  const q=QA.find(x=>x.id===state.selQ);
  if(!q){
    panel.innerHTML=`<h3>Record an issuer answer</h3><div style="font-size:var(--text-sm);color:var(--text-3);line-height:1.6">Select a question on the left, or import the official response document to let the matching attach answers to questions.</div>`;
    return;
  }
  if(q.st==="answered"){
    panel.innerHTML=`<h3>${q.id} — answered</h3>
      <div class="qa-ans" style="margin-top:0"><b>Issuer answer · ${q.ansDate}</b>${esc(q.ans)}</div>
      <div style="font-size:var(--text-sm);color:var(--text-3);line-height:1.6;margin-top:10px">Attached to ${esc(refsLabel(q))}. The assignment it was blocking is unblocked in Compliance.</div>`;
    return;
  }
  panel.innerHTML=`<h3>Record the issuer's answer</h3>
    <div style="font-size:var(--text-sm);color:var(--text-2);line-height:1.5;margin-bottom:10px">${esc(q.q)}</div>
    <textarea id="ans-text" rows="4" style="width:100%;background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--radius-md);padding:var(--space-2);font-size:var(--text-sm);color:var(--text);font-family:inherit" placeholder="Paste the issuer's official wording…"></textarea>
    <button class="btn-primary" id="save-ans" style="width:100%;justify-content:center;margin-top:10px">Save answer</button>`;
  panel.querySelector("#save-ans").addEventListener("click",()=>{
    const t=panel.querySelector("#ans-text").value.trim();
    if(!t){ toast("Paste the answer first","warn"); return; }
    q.st="answered"; q.ans=t; q.ansDate="Today";
    toast(`${q.id} answered — ${esc(refsLabel(q))} unblocked`,"ok");
    renderAll();
  });
}
document.getElementById("bulk-import").addEventListener("click",()=>{
  if(state.imported){ toast("Response document already imported","warn"); return; }
  const sent=questionsSent();
  if(!sent.length){ toast("No exported question is waiting for an answer","warn"); return; }
  state.imported=true;
  sent.forEach((q,i)=>{
    if(i===0){ q.st="answered"; q.ans="Confirmed by the issuer in the official response dossier."; q.ansDate="Today"; }
    else { q.flagged=true; }
  });
  const matched=1, unsure=sent.length-1;
  toast(`Response document imported — ${matched} matched automatically${unsure?`, ${unsure} need confirming`:""}`, unsure?"warn":"ok");
  renderAll();
});

/* ---------- tabs ---------- */
document.querySelectorAll(".hub-tabs button").forEach(b=>b.addEventListener("click",()=>{
  state.htab=b.dataset.htab;
  document.querySelectorAll(".hub-tabs button").forEach(x=>x.classList.toggle("active",x===b));
  document.getElementById("htab-register").style.display=state.htab==="register"?"block":"none";
  document.getElementById("htab-issuer").style.display=state.htab==="issuer"?"block":"none";
}));
function renderAll(){ renderRegister(); renderIssuer(); }
renderAll();
</script>
