/* Antarctica — the brand title face. Not on any public CDN and not installed
   here, so it resolves in this order: an installed copy, then the files under
   fonts/ (drop Antarctica-Regular.woff2 and Antarctica-Bold.woff2 there — the
   srcdoc screens resolve relative URLs against index.html), then Alstom.
   Nothing breaks while the files are missing; titles simply stay in Alstom. */
@font-face{font-family:"Antarctica";font-weight:400;font-display:swap;src:local("Antarctica"),local("Antarctica-Regular"),url("fonts/Antarctica-Regular.woff2") format("woff2")}
@font-face{font-family:"Antarctica";font-weight:700;font-display:swap;src:local("Antarctica Bold"),local("Antarctica-Bold"),url("fonts/Antarctica-Bold.woff2") format("woff2")}
/* Alstom — the brand's own typeface (DEC-115): all interface text, and the
   titles until Antarctica is supplied. Licensed: build_fonts.py makes the web
   copies under fonts/, never versioned; build_merge.py embeds them only in the
   outputs allowed to carry them. Never local(): the desktop TTFs carry 1-bit
   bitmaps that Chrome on Windows draws instead of the outlines at 9-18 px.
   Matched to Noto Sans, the fallback: size-adjust brings its x-height to
   Noto's (0.479 → 0.536 em) and the overrides set Noto's ascent and descent
   (1.069 / 0.293 em, divided by the 1.12 they get scaled by) — same baseline,
   same line boxes, so the fallback changes the letters, never the layout.
   No SemiBold or ExtraBold in the family: 600 is drawn with the Medium, 800
   with the Bold, each declared as its own face so Chrome doesn't fake-bolden
   it. No italic either: italics are the Regular slanted, which is what this
   kind of face does anyway. */
@font-face{font-family:"Alstom UI";font-weight:400;font-display:swap;src:url("fonts/Alstom-Regular.woff") format("woff");size-adjust:112%;ascent-override:95.4%;descent-override:26.2%;line-gap-override:0%}
@font-face{font-family:"Alstom UI";font-weight:500;font-display:swap;src:url("fonts/Alstom-Medium.woff") format("woff");size-adjust:112%;ascent-override:95.4%;descent-override:26.2%;line-gap-override:0%}
@font-face{font-family:"Alstom UI";font-weight:600;font-display:swap;src:url("fonts/Alstom-Medium.woff") format("woff");size-adjust:112%;ascent-override:95.4%;descent-override:26.2%;line-gap-override:0%}
@font-face{font-family:"Alstom UI";font-weight:700;font-display:swap;src:url("fonts/Alstom-Bold.woff") format("woff");size-adjust:112%;ascent-override:95.4%;descent-override:26.2%;line-gap-override:0%}
@font-face{font-family:"Alstom UI";font-weight:800;font-display:swap;src:url("fonts/Alstom-Bold.woff") format("woff");size-adjust:112%;ascent-override:95.4%;descent-override:26.2%;line-gap-override:0%}

:root{
  --bg:#071A30; --panel:#0B294A; --panel-2:#143556; --panel-3:#1D4062;
  --line:#1F3E5F; --line-2:#2E4E70;
  --text:#EEF1F8; --text-2:#AAB6C6; --text-3:#8B9AAD;
  --accent:#4C82FF; --accent-soft:#1B3F6B; --accent-hover:color-mix(in srgb, var(--accent) 75%, white);
  --ia:#E3A64B; --ia-soft:rgba(227,166,75,.12);
  --ok:#3FBE86; --ok-soft:rgba(63,190,134,.12);
  --human:#a06ef2; --human-soft:rgba(160,110,242,.12);
  --warn:#F2604F; --warn-soft:rgba(242,96,79,.12);
  --text-xs:11px; --text-sm:12px; --text-base:13px; --text-lg:16px; --text-xl:21px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px;
  --radius-xs:4px; --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-pill:999px;
  --font-ui:"Alstom UI","Noto Sans","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-heading:"Antarctica","Alstom UI","Noto Sans","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --brand-red:#E4002B; /* placeholder — exact brand red to confirm */
  /* 2026-10-06 — the home page's colour, beside the navy: a brighter brand blue,
     its pale tint and a slate for the minor product lines (not on the tracked scale) */
  --brand-blue:#5B8CF5; --brand-blue-soft:#1A3560; --brand-slate:#5F7A99;
  --font-mono:"Alstom UI",ui-monospace,"SF Mono","Cascadia Code",Menlo,monospace; /* IDs and codes: the brand face (its figures all share one width, so IDs still line up), the monospace stack wherever it is absent */
}
html[data-theme="light"]{
  --bg:#F4F5FA; --panel:#FFFFFF; --panel-2:#F4F5FA; --panel-3:#E6E6F0;
  --line:#E1E3EE; --line-2:#CDD2E3;
  --text:#1E3246; --text-2:#4A5A6E; --text-3:#637187;
  --accent:#0B294A; --accent-soft:#E6EBF2;
  --ia:#C67A16; --ia-soft:rgba(198,122,22,.12);
  --ok:#1E8E5A; --ok-soft:rgba(30,142,90,.12);
  --human:#8250dc; --human-soft:rgba(130,80,220,.12);
  --warn:#DC3223; --warn-soft:rgba(220,50,35,.10);
  --brand-blue:#2F6BD8; --brand-blue-soft:#E3ECFA; --brand-slate:#4F6A88;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);font-size:var(--text-base);-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:var(--radius-sm);border:2px solid var(--bg)}
#app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:var(--space-4);height:52px;padding:0 var(--space-5);background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
.logo{display:flex;align-items:center;gap:var(--space-2);font-weight:700;font-size:var(--text-base);letter-spacing:-.2px}
/* the company's logo, then the product's name in text (2026-10-09) — the SRM
   mark stays the favicon. Colour on light, white on dark: the files supplied,
   not tokens; height on the cap line of "SRM" */
.brand-logo{display:flex;align-items:center;padding-right:var(--space-4);border-right:1px solid var(--line);height:20px;flex-shrink:0}
.brand-logo img{height:15px;width:auto;display:block}
.brand-logo .brand-light{display:none}
html[data-theme="light"] .brand-logo .brand-light{display:block}
html[data-theme="light"] .brand-logo .brand-dark{display:none}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.btn-ghost{padding:7px var(--space-3);border-radius:var(--radius-md);border:1px solid var(--line-2);color:var(--text-2);font-weight:500;font-size:var(--text-sm);transition:all .15s;display:inline-flex;gap:6px;align-items:center}
.btn-ghost:hover{border-color:var(--accent);color:var(--text)}
.btn-primary{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-radius:var(--radius-md);background:var(--accent);color:#fff;font-weight:600;font-size:var(--text-base);transition:all .15s}
.btn-primary:hover{background:var(--accent-hover)}
.reset-btn{font-size:var(--text-xs);color:var(--text-3);padding:var(--space-1) var(--space-3);border-radius:var(--radius-md);border:1px solid transparent}
.reset-btn:hover{border-color:var(--warn);color:var(--warn)}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#e0a43c,#c4763a);display:grid;place-items:center;font-size:var(--text-xs);font-weight:700;color:#fff;cursor:pointer}

/* Same flat --bg as every project screen (2026-10-07): a blue wash at the top
   of this page made home and project read as two different apps, and the
   colour already lives in the hero, the line map and the accents. */
.scroll{flex:1;overflow-y:auto}
.wrap{max-width:1180px;margin:0 auto;padding:var(--space-8) var(--space-6) 80px}
/* 2026-10-06 — the home page as the tool's front door: a greeting and what
   SRM is for, the way back into the last tender, how a
   tender travels through SRM (the tender's line, explained — dismissible),
   then the tenders. The rail-line motif carries
   the brand: the hero's map and the four stations. */
.home-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:var(--space-8);align-items:center;padding:var(--space-8);margin-bottom:var(--space-6);border:1px solid var(--line);border-radius:var(--radius-lg);background:linear-gradient(115deg,var(--panel) 38%,var(--brand-blue-soft))}
.hero-map{position:absolute;right:-20px;bottom:-10px;width:640px;height:auto;pointer-events:none}
/* below the hero's full width there is no room beside the Continue card: the
   card moves under the greeting, and the map fills the free corner beside it */
@media (max-width:1220px){
  .home-hero{grid-template-columns:minmax(0,1fr)}
  #continue-slot{max-width:460px;position:relative}
  .hero-map{width:440px;right:-30px;bottom:-14px}
}
.hero-txt{position:relative;min-width:0}
.hero-kicker{font-size:var(--text-xs);font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--brand-blue)}
.hello-name{color:var(--brand-blue)}
.home-hero h1{margin-top:var(--space-2);font-size:32px;font-weight:700;letter-spacing:-.6px;line-height:1.15;text-wrap:balance}
.hero-lead{margin-top:var(--space-3);max-width:520px;font-size:var(--text-lg);line-height:1.45;color:var(--text-2)}
.hero-roles{margin-top:var(--space-3);font-size:var(--text-sm);color:var(--text-3)}
.hero-roles b{color:var(--text-2)}
.hero-cta{display:flex;flex-wrap:wrap;gap:var(--space-3);margin-top:var(--space-5)}
.continue::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;background:linear-gradient(90deg,var(--accent),var(--brand-blue))}
.continue{position:relative;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-5) var(--space-5) var(--space-4);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:0 10px 30px rgba(14,30,50,.10);cursor:pointer;transition:transform .15s,border-color .15s}
.continue:hover{border-color:var(--accent);transform:translateY(-2px)}
.continue-k{font-size:var(--text-xs);font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-3)}
.continue-n{font-family:var(--font-heading);font-size:var(--text-lg);font-weight:700;line-height:1.3}
.continue-ref{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-3);margin-top:2px}
.continue-next{font-size:var(--text-sm);color:var(--text-2)}
.continue-next b{color:var(--text)}
.continue .btn-primary{align-self:flex-start}
/* section heads, one style for the page */
.home-sec{display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-3)}
.home-sec h3{font-size:var(--text-lg);font-weight:700;letter-spacing:-.2px}
.home-sec h3::before{content:"";display:inline-block;width:4px;height:.8em;border-radius:2px;background:var(--brand-red);margin-right:.45em;vertical-align:-.06em}
.home-sec .hint{font-size:var(--text-sm);color:var(--text-3)}
.home-sec .act{margin-left:auto;font-size:var(--text-sm);color:var(--text-3)}
.home-sec .act:hover{color:var(--text)}
/* how a tender travels through SRM — the four stations, explained */
.howto{margin:var(--space-8) 0}   /* no frame: the four stations sit on the page itself */
.ht-line{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-5);margin-top:var(--space-2)}
.ht-line::before{content:"";position:absolute;left:12.5%;right:12.5%;top:13px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--brand-blue),var(--accent))}
.ht-st{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center}
.ht-st:nth-child(1) .ht-dot{background:var(--brand-blue)}
.ht-st:nth-child(2) .ht-dot{background:color-mix(in srgb, var(--brand-blue) 66%, var(--accent))}
.ht-st:nth-child(3) .ht-dot{background:color-mix(in srgb, var(--brand-blue) 33%, var(--accent))}
.ht-dot{position:relative;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:var(--text-sm);box-shadow:0 0 0 5px var(--bg)}
.ht-name{margin-top:var(--space-3);font-family:var(--font-heading);font-size:var(--text-lg);font-weight:700}
.ht-txt{margin-top:var(--space-1);font-size:var(--text-sm);line-height:1.5;color:var(--text-2);max-width:250px}
.ht-who{margin-top:var(--space-2);font-size:var(--text-xs);font-weight:600;padding:2px var(--space-2);border-radius:var(--radius-md);background:var(--accent-soft);color:var(--accent);text-wrap:balance}
.ht-who.contrib{background:var(--brand-blue-soft);color:var(--brand-blue)}
.ht-always{margin-top:var(--space-5);font-size:var(--text-sm);color:var(--text-3);text-align:center}
.ht-always b{color:var(--text-2)}
.home-nav-intro{margin-bottom:var(--space-4)}
.tabs{display:flex;gap:6px;margin-bottom:var(--space-5);border-bottom:1px solid var(--line)}
.tab{padding:var(--space-2) var(--space-4);font-size:var(--text-base);color:var(--text-3);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab:hover{color:var(--text-2)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab .c{font-size:var(--text-xs);color:var(--text-3);margin-left:var(--space-1);font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-4);cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:var(--space-3);min-height:172px}
.pcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.pcard.processing{cursor:default}
.pcard.processing:hover{transform:none;border-color:var(--line)}
.pcard.submitted{opacity:.72}
.pc-top{display:flex;align-items:center;gap:8px}
.pc-ref{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-3);letter-spacing:.3px}
/* 2026-10-06 — the two facts that decide what a tender asks of you, made
   visible: its product line, as a metro-line badge, and your role on it. The
   stage pill went — the tender's line already says where it stands. */
.pc-lineb{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:var(--radius-xs);background:var(--accent);color:#fff;font-size:var(--text-xs);font-weight:500;letter-spacing:.9px;text-transform:uppercase;white-space:nowrap}
.pc-role{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 var(--space-3);border-radius:var(--radius-pill);background:var(--panel-3);color:var(--text-2);font-size:var(--text-sm);font-weight:600;white-space:nowrap}
.pc-role{background:var(--brand-blue-soft);color:var(--brand-blue)}
.pc-role.is-pm{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.pc-lineb.l-sig{background:var(--brand-blue)}
.pc-lineb.l-other{background:var(--brand-slate)}
.pc-proc{display:inline-flex;align-items:center;gap:6px;color:var(--brand-blue);font-weight:600}
.pc-proc .bdot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pc-name{font-family:var(--font-heading);font-size:var(--text-lg);font-weight:700;letter-spacing:-.2px;line-height:1.3}
.pc-line{display:flex;flex-direction:column;gap:6px;margin-top:2px}
/* the tender's line in miniature (2026-10-06) — the dashboard's line, four
   stations, the current one ringed and named with its count */
.ml{position:relative;height:12px;display:grid;grid-template-columns:repeat(4,1fr)}
.ml-seg{position:absolute;top:4px;width:25%;height:4px;border-radius:2px;background:var(--line-2);overflow:hidden}
.ml-seg>i{display:block;height:100%;background:var(--accent);transition:width .5s ease}
.ml-dot{justify-self:center;position:relative;z-index:1;width:12px;height:12px;box-sizing:border-box;border-radius:50%;border:3px solid var(--line-2);background:var(--panel)}
.ml-dot.done{background:var(--accent);border-color:var(--accent)}
.ml-dot.current{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ml-lbl{display:grid;grid-template-columns:repeat(4,1fr);font-size:var(--text-xs);color:var(--text-3);text-align:center}
.ml-lbl .on{color:var(--text);font-weight:700}
.ml-lbl .on em{font-style:normal;color:var(--accent);margin-left:3px;font-variant-numeric:tabular-nums}
.pc-foot{display:flex;align-items:center;font-size:var(--text-xs);color:var(--text-3);margin-top:auto;padding-top:var(--space-3);border-top:1px solid var(--line)}
.pc-foot .open{margin-left:auto;color:var(--accent);opacity:0;transition:opacity .15s}
.pcard:hover .pc-foot .open{opacity:1}
.pc-processing-note{font-size:var(--text-xs);color:var(--text-3)}
.empty{grid-column:1/-1;border:1px dashed var(--line-2);border-radius:var(--radius-lg);padding:40px;text-align:center;color:var(--text-3);font-size:var(--text-base)}

#toast-zone{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:var(--space-2);align-items:center}
.toast{display:flex;align-items:center;gap:var(--space-3);background:var(--panel-3);border:1px solid var(--line-2);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);font-size:var(--text-base);box-shadow:0 8px 32px rgba(0,0,0,.5);animation:tin .3s cubic-bezier(.34,1.3,.64,1)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.t-ok{color:var(--ok)}.t-warn{color:var(--ia)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- brand touches (22 Sept 2026) ---------------------------------------
   Titles take the heading face. The red is DECORATIVE ONLY: a small mark
   ahead of page titles — never on anything clickable or stateful,
   because red already means "not compliant" / "warn" in this UI and a red
   control would read as an error. Exact brand red still to be confirmed. */
h1,h2,h3,.cfg-h,.set-title,.view-panel-head,.fb-bh{font-family:var(--font-heading)}
h1::before,h2::before{content:"";display:inline-block;width:5px;height:.85em;border-radius:2px;background:var(--brand-red);margin-right:.45em;vertical-align:-.08em}
/* icons (2026-09-24): one stroke style for every UI icon, drawn with a CSS mask so it takes the text colour.
   Replaces emoji (rendered as coloured Apple emoji) and symbols Noto Sans doesn't carry (rendered tiny or
   in a fallback font). Markup: <i class=ic-NAME></i> — no quotes, so it is safe inside any JS string. */
i[class^="ic-"]{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.16em;flex-shrink:0;background:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat;font-style:normal}

<script>
/* TICKETS-prototype-batch6.md "Prepare the login for SSO" — identity now comes
   from the shell's directory-shaped getCurrentUser(), not typed into each
   screen's own markup (every screen had "Thibaud Breton"/"TB" hardcoded
   independently — six copies, no source of truth). No real SSO integration —
   prototype-level, per the ticket — but the screens now assume an identity
   handed to them. Standalone file:// open (no parent) keeps the same default
   so a screen still renders sensibly opened on its own, consistent with how
   CURRENT_PROJECT already falls back elsewhere in these files. */
(function(){
  try{
    const u=(window.parent!==window && window.parent.getCurrentUser) ? window.parent.getCurrentUser() : {name:"Thibaud Breton",title:"Bid Director",init:"TB"};
    const av=document.getElementById("header-avatar");
    if(av){ av.textContent=u.init; av.title=u.title?`${u.name} — ${u.title}`:u.name; }
  }catch(e){}
})();
function toast(msg,kind="ok"){
  const z=document.getElementById("toast-zone"),t=document.createElement("div");
  t.className="toast";
  t.innerHTML=`<span class="${kind==="ok"?"t-ok":"t-warn"}">${kind==="ok"?"✓":"⚠"}</span><span>${msg}</span>`;
  z.appendChild(t);
  setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .3s";setTimeout(()=>t.remove(),300)},2600);
}
const TAB_DEFS=[
  {id:"all",label:"All"},
  {id:"processing",label:"Processing"},
  {id:"active",label:"In progress"},
  {id:"submitted",label:"Submitted"},
];
let activeTab="all";

function getProjects(){
  try{ if(window.parent!==window && window.parent.getProjects) return window.parent.getProjects(); }catch(e){}
  return [];
}
function inTab(p){
  if(activeTab==="all") return true;
  if(activeTab==="processing") return p.status==="processing";
  if(activeTab==="submitted") return p.status==="submitted";
  if(activeTab==="active") return p.status!=="processing" && p.status!=="submitted";
  return true;
}
/* 2026-10-06 — the card's gauge is the tender's line in miniature: Capture,
   Allocation, Compliance, Submission, the current station named with its count
   (§1.2's two gauges, Allocation then Compliance, now read along the line; the
   switch at 100% allocated still applies). */
const LINE_STATIONS=["Capture","Allocation","Compliance","Submission"];
function gaugeHTML(p){
  let cur, fills, count="";
  if(p.status==="processing"){ cur=0; fills=[p.progress||0,0,0]; count=Math.round(p.progress||0)+"%"; }
  else if(p.status==="submitted"){ cur=4; fills=[100,100,100]; }
  else {
    const total=p.total||0, allocated=Math.min(p.allocated||0,total), filled=Math.min(p.complianceFilled||0,total);
    if(total>0 && allocated>=total){ cur=2; fills=[100,100,filled/total*100]; count=`${filled}/${total}`; }
    else { cur=1; fills=[100,total?allocated/total*100:0,0]; count=`${allocated}/${total}`; }
  }
  const dots=LINE_STATIONS.map((n,i)=>`<span class="ml-dot${i<cur?" done":i===cur?" current":""}"></span>`).join("");
  const lbls=LINE_STATIONS.map((n,i)=>`<span class="${i===cur||(cur===4&&i===3)?"on":""}">${n}${i===cur&&count?`<em>${count}</em>`:""}${cur===4&&i===3?"<em>✓</em>":""}</span>`).join("");
  const segs=[0,1,2].map(i=>`<span class="ml-seg" style="left:${12.5+25*i}%"><i style="width:${Math.round(fills[i])}%"></i></span>`).join("");
  const title=p.status==="processing"?(p.procLabel||"AI capturing & characterising…"):p.status==="submitted"?`Response submitted · ${p.reqs||0} requirements`:"";
  return `<div class="pc-line"${title?` title="${title}"`:""}><div class="ml">${segs}${dots}</div><div class="ml-lbl">${lbls}</div></div>`;
}
function cardHTML(p){
  const pm=/project\s*manager/i.test(p.role||"");   // §1.4 — one role per person per project, two labels
  const foot = p.status==="processing" ? `<span class="pc-proc"><span class="bdot"></span>Processing — opens when it completes</span>`
    : p.builtOut===false ? `<span class="pc-processing-note">Demo project — list &amp; status only</span>`
    : `Updated ${p.updated||"recently"}`;
  return `<div class="pcard ${p.status}" data-id="${p.id}">
    <div class="pc-top">
      <span class="pc-lineb ${/^turnkey$/i.test(p.line)?"l-turnkey":/^sig$/i.test(p.line)?"l-sig":"l-other"}" title="Product line">${p.line}</span><span class="pc-ref">${p.ref}</span>
      <span class="pc-role${pm?" is-pm":""}" title="Your role on this tender"><i class=${pm?"ic-flag":"ic-users"}></i>${pm?"Project manager":"Contributor"}</span>
    </div>
    <div class="pc-name">${p.name}</div>
    ${gaugeHTML(p)}
    <div class="pc-foot"><span>${foot}</span>${(p.status!=="processing"&&p.builtOut!==false)?'<span class="open">Open →</span>':""}</div>
  </div>`;
}
/* ---------- the front door (2026-10-06) ---------- */
function currentUser(){
  try{ if(window.parent!==window && window.parent.getCurrentUser) return window.parent.getCurrentUser(); }catch(e){}
  return {name:"Thibaud Breton",title:"Bid Director",init:"TB"};
}
const isPM=p=>/project\s*manager/i.test(p.role||"");
const escH=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
/* the tender to pick up again: the one marked primary, else the first open, built-out one */
function continueProject(projects){
  const open=projects.filter(p=>p.status!=="processing"&&p.status!=="submitted"&&p.builtOut!==false);
  return open.find(p=>p.primary)||open[0]||null;
}
function nextStep(p){
  const total=p.total||0, allocated=Math.min(p.allocated||0,total), filled=Math.min(p.complianceFilled||0,total);
  if(total>0&&allocated>=total) return `<b>${total-filled}</b> requirement${total-filled!==1?"s":""} still to answer in Compliance`;
  return `<b>${total-allocated}</b> requirement${total-allocated!==1?"s":""} still to allocate`;
}
function renderHero(projects){
  const u=currentUser(), h=new Date().getHours();
  document.getElementById("hero-hello").innerHTML=`${h<12?"Good morning":h<18?"Good afternoon":"Good evening"}, <span class="hello-name">${escH((u.name||"").split(" ")[0]||"welcome")}</span>`;
  const lead=projects.filter(isPM).length, contrib=projects.length-lead;
  document.getElementById("hero-roles").innerHTML=projects.length
    ? `You lead <b>${lead}</b> tender${lead!==1?"s":""} as project manager${contrib?` and contribute to <b>${contrib}</b>`:""}.`
    : "No tender yet — create the first one, or ask a project manager to add you to theirs.";
  const c=continueProject(projects), slot=document.getElementById("continue-slot");
  slot.innerHTML = c ? `<div class="continue" id="continue-card" title="Open ${escH(c.name)}">
      <div class="continue-k">Pick up where you left off</div>
      <div><div class="continue-n">${escH(c.name)}</div><div class="continue-ref">${escH(c.ref)} · updated ${escH(c.updated||"")}</div></div>
      ${gaugeHTML(c)}
      <div class="continue-next">${nextStep(c)}</div>
      <button class="btn-primary" tabindex="-1">Continue →</button>
    </div>` : "";
  document.getElementById("continue-card")?.addEventListener("click",()=>openTender(c));
}
/* how a tender travels through SRM — shown until dismissed (kept in the shell,
   so a demo reset brings it back); "How SRM works" in the hero reopens it */
const HOWTO=[
  ["Capture","The AI reads the tender's documents and captures every requirement, table row and figure. You check what it found.","Project manager","pm"],
  ["Allocation","Each requirement gets its nature, class and systems, then the organisation (OBS) and the person who will answer it.","Project manager, then each system","pm"],
  ["Compliance","Each contributor gives a verdict. A Not compliant gets a gap strategy and a risk; the verdicts consolidate per requirement.","Contributors","contrib"],
  ["Submission","Export to DOORS or Excel, and hand the client the compliance matrix.","Project manager","pm"],
];
function introHidden(){ try{ return !!window.parent.getHomeIntroHidden(); }catch(e){ return false; } }
function renderHowto(){
  const el=document.getElementById("howto");
  if(introHidden()){ el.hidden=true; return; }
  el.hidden=false;
  el.innerHTML=`<div class="home-sec"><h3>How a tender travels through SRM</h3><span class="hint">four stations, the same for every tender</span><button class="act" id="howto-hide">Got it — hide</button></div>
    <div class="ht-line">${HOWTO.map(([n,t,w,k],i)=>`<div class="ht-st"><span class="ht-dot">${i+1}</span><span class="ht-name">${n}</span><span class="ht-txt">${t}</span><span class="ht-who ${k}">${w}</span></div>`).join("")}</div>
    <div class="ht-always">Always open alongside: <b>Documents &amp; versions</b> · <b>Q&amp;A with the client</b> · <b>Risks</b> · <b>Team casting</b></div>`;
  el.querySelector("#howto-hide").addEventListener("click",()=>{ try{ window.parent.setHomeIntroHidden(true); }catch(e){} renderHowto(); });
}
function openTender(p){
  if(!p) return;
  if(p.status==="processing"){ toast("Still processing — it will open when the models finish","warn"); return; }
  // TA1 — only "stb2026" and "rfp114" have real, built-out screens (builtOut:true in
  // build_merge.py's seedProjects). The other seeds exist to illustrate the
  // list/status/processing only — say so explicitly instead of silently opening
  // into another tender's content.
  if(p.builtOut===false){ toast("This is a demo-only project in this prototype — open Energy Monitoring System (STB-2026) or Line 4 Resignalling (RFP-2026-114) for a full, navigable build","warn"); return; }
  try{ if(window.parent!==window && window.parent.openProject) window.parent.openProject(p.id); }catch(e){}
}

function render(){
  const projects=getProjects();
  document.getElementById("home-sub").textContent=`${projects.length} tender${projects.length!==1?"s":""}`;
  renderHero(projects);
  // tabs
  const tabs=document.getElementById("tabs");
  tabs.innerHTML=TAB_DEFS.map(t=>{
    const n = t.id==="all"?projects.length
      :t.id==="processing"?projects.filter(p=>p.status==="processing").length
      :t.id==="submitted"?projects.filter(p=>p.status==="submitted").length
      :projects.filter(p=>p.status!=="processing"&&p.status!=="submitted").length;
    return `<button class="tab ${activeTab===t.id?"on":""}" data-tab="${t.id}">${t.label}<span class="c">${n}</span></button>`;
  }).join("");
  tabs.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{activeTab=b.dataset.tab;render();}));
  // grid
  const shown=projects.filter(inTab);
  const grid=document.getElementById("grid");
  grid.innerHTML = shown.length?shown.map(cardHTML).join(""):`<div class="empty">No tender in this view.</div>`;
  grid.querySelectorAll(".pcard").forEach(c=>c.addEventListener("click",()=>openTender(projects.find(x=>x.id===c.dataset.id))));
}
document.getElementById("new-btn").addEventListener("click",()=>{ try{ window.parent.route("new"); }catch(e){} });
document.getElementById("new-btn-2").addEventListener("click",()=>{ try{ window.parent.route("new"); }catch(e){} });
document.getElementById("reset-btn").addEventListener("click",()=>{
  if(confirm("Reset the demo to its initial state? This clears all progress made during the session.")){
    try{ if(window.parent!==window && window.parent.resetDemo) window.parent.resetDemo(); }catch(e){}
  }
});
document.getElementById("howto-btn").addEventListener("click",()=>{
  try{ window.parent.setHomeIntroHidden(false); }catch(e){}
  renderHowto(); document.getElementById("howto").scrollIntoView({behavior:"smooth",block:"center"});
});
// poll so background processing bars animate live
renderHowto();
render();
setInterval(()=>{ if(getProjects().some(p=>p.status==="processing")) render(); }, 700);
// apply theme
try{ var t=(window.parent!==window&&window.parent.getTheme)?window.parent.getTheme():"light"; document.documentElement.setAttribute("data-theme",t);}catch(e){}
</script>
</body>
