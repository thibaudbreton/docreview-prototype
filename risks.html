/* Antarctica — the brand title face. Not on any public CDN and not installed
   here, so it resolves in this order: an installed copy, then the files under
   fonts/ (drop Antarctica-Regular.woff2 and Antarctica-Bold.woff2 there — the
   srcdoc screens resolve relative URLs against index.html), then Alstom.
   Nothing breaks while the files are missing; titles simply stay in Alstom. */
@font-face{font-family:"Antarctica";font-weight:400;font-display:swap;src:local("Antarctica"),local("Antarctica-Regular"),url("fonts/Antarctica-Regular.woff2") format("woff2")}
@font-face{font-family:"Antarctica";font-weight:700;font-display:swap;src:local("Antarctica Bold"),local("Antarctica-Bold"),url("fonts/Antarctica-Bold.woff2") format("woff2")}
/* Alstom — the brand's own typeface (DEC-115): all interface text, and the
   titles until Antarctica is supplied. Licensed: build_fonts.py makes the web
   copies under fonts/, never versioned; build_merge.py embeds them only in the
   outputs allowed to carry them. Never local(): the desktop TTFs carry 1-bit
   bitmaps that Chrome on Windows draws instead of the outlines at 9-18 px.
   Matched to Noto Sans, the fallback: size-adjust brings its x-height to
   Noto's (0.479 → 0.536 em) and the overrides set Noto's ascent and descent
   (1.069 / 0.293 em, divided by the 1.12 they get scaled by) — same baseline,
   same line boxes, so the fallback changes the letters, never the layout.
   No SemiBold or ExtraBold in the family: 600 is drawn with the Medium, 800
   with the Bold, each declared as its own face so Chrome doesn't fake-bolden
   it. No italic either: italics are the Regular slanted, which is what this
   kind of face does anyway. */
@font-face{font-family:"Alstom UI";font-weight:400;font-display:swap;src:url("fonts/Alstom-Regular.woff") format("woff");size-adjust:112%;ascent-override:95.4%;descent-override:26.2%;line-gap-override:0%}
@font-face{font-family:"Alstom UI";font-weight:500;font-display:swap;src:url("fonts/Alstom-Medium.woff") format("woff");size-adjust:112%;ascent-override:95.4%;descent-override:26.2%;line-gap-override:0%}
@font-face{font-family:"Alstom UI";font-weight:600;font-display:swap;src:url("fonts/Alstom-Medium.woff") format("woff");size-adjust:112%;ascent-override:95.4%;descent-override:26.2%;line-gap-override:0%}
@font-face{font-family:"Alstom UI";font-weight:700;font-display:swap;src:url("fonts/Alstom-Bold.woff") format("woff");size-adjust:112%;ascent-override:95.4%;descent-override:26.2%;line-gap-override:0%}
@font-face{font-family:"Alstom UI";font-weight:800;font-display:swap;src:url("fonts/Alstom-Bold.woff") format("woff");size-adjust:112%;ascent-override:95.4%;descent-override:26.2%;line-gap-override:0%}

:root{
  --bg:#071A30; --panel:#0B294A; --panel-2:#143556; --panel-3:#1D4062;
  --line:#1F3E5F; --line-2:#2E4E70;
  --text:#EEF1F8; --text-2:#AAB6C6; --text-3:#8B9AAD;
  --accent:#4C82FF; --accent-soft:#1B3F6B; --accent-hover:color-mix(in srgb, var(--accent) 75%, white);
  --ia:#E3A64B; --ia-soft:rgba(227,166,75,.12);
  --ok:#3FBE86; --ok-soft:rgba(63,190,134,.12);
  --human:#a06ef2; --human-soft:rgba(160,110,242,.12);
  --warn:#F2604F; --warn-soft:rgba(242,96,79,.12);
  --paper:#fbfaf6; --paper-ink:#1d2129; --paper-ink-2:#4a5162;
  --text-xs:11px; --text-sm:12px; --text-base:13px; --text-lg:16px; --text-xl:21px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px;
  --radius-xs:4px; --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-pill:999px;
  --font-ui:"Alstom UI","Noto Sans","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-heading:"Antarctica","Alstom UI","Noto Sans","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --brand-red:#E4002B; /* placeholder — exact brand red to confirm */
  --font-doc:Georgia,"Times New Roman",serif;
  --font-mono:"Alstom UI",ui-monospace,"SF Mono","Cascadia Code",Menlo,monospace; /* IDs and codes: the brand face (its figures all share one width, so IDs still line up), the monospace stack wherever it is absent */
}

html[data-theme="light"]{
  --bg:#F4F5FA;
  --panel:#FFFFFF;
  --panel-2:#F4F5FA;
  --panel-3:#E6E6F0;
  --line:#E1E3EE;
  --line-2:#CDD2E3;
  --text:#1E3246;
  --text-2:#4A5A6E;
  --text-3:#637187;
  --accent:#0B294A;
  --accent-soft:#E6EBF2;
  --ia:#C67A16;
  --ia-soft:rgba(198,122,22,.12);
  --ok:#1E8E5A;
  --ok-soft:rgba(30,142,90,.12);
  --human:#8250dc;
  --human-soft:rgba(130,80,220,.12);
  --warn:#DC3223;
  --warn-soft:rgba(220,50,35,.10);
  --paper:#ffffff;
  --paper-ink:#1d2129;
  --paper-ink-2:#4a5162;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);font-size:var(--text-base);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:var(--radius-sm);border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius-xs)}
#app{display:flex;flex-direction:column;height:100vh}

/* ---------- Header ---------- */
header{display:flex;align-items:center;gap:var(--space-4);height:52px;padding:0 var(--space-4);background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
.logo{display:flex;align-items:center;gap:var(--space-2);font-weight:700;font-size:var(--text-base);letter-spacing:-.2px}
/* the company's logo, then the product's name in text (2026-10-09) — the SRM
   mark stays the favicon. Colour on light, white on dark: the files supplied,
   not tokens; height on the cap line of "SRM" */
.brand-logo{display:flex;align-items:center;padding-right:var(--space-4);border-right:1px solid var(--line);height:20px;flex-shrink:0}
.brand-logo img{height:15px;width:auto;display:block}
.brand-logo .brand-light{display:none}
html[data-theme="light"] .brand-logo .brand-light{display:block}
html[data-theme="light"] .brand-logo .brand-dark{display:none}
.crumb{display:flex;align-items:center;gap:var(--space-2);color:var(--text-2);min-width:0}
.crumb .sep{color:var(--text-3)}
.crumb .project{color:var(--text);font-weight:600;white-space:nowrap;text-decoration:none;cursor:pointer;border-radius:var(--radius-xs);transition:color .15s}
.crumb .project:hover{color:var(--accent)}
.hdr-actions{display:flex;align-items:center;gap:8px}
.icon-btn{position:relative;width:32px;height:32px;border-radius:var(--radius-md);display:grid;place-items:center;color:var(--text-2);transition:all .15s}
.icon-btn:hover{background:var(--panel-3);color:var(--text)}

.btn-ghost{padding:6px var(--space-3);border-radius:var(--radius-md);border:1px solid var(--line-2);color:var(--text-2);font-weight:500;font-size:var(--text-sm);transition:all .15s;display:inline-flex;gap:6px;align-items:center}
.btn-ghost:hover{border-color:var(--accent);color:var(--text)}
/* main menu bar — icon + label button for moving between screens. Reads as a
   destination rather than a back-arrow, which is what the plain "X →" ghost
   links had become once the breadcrumb took over "back to the dashboard". */
.nav-btn{display:inline-flex;align-items:center;gap:7px;padding:6px var(--space-3);border-radius:var(--radius-md);border:1px solid var(--line-2);background:var(--panel);color:var(--text-2);font-size:var(--text-sm);font-weight:600;white-space:nowrap;text-decoration:none;transition:all .15s}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#e0a43c,#c4763a);display:grid;place-items:center;font-size:var(--text-xs);font-weight:700;color:#fff;cursor:pointer}
/* ===================== Risks =====================
   SPEC-risks.md §6, as reduced by DEC-113: the tender's list of risks, each
   with its justification — the three answers of the template — and the
   requirements it is linked to. No weight, status, comments or merge: the risk
   work itself is done outside the tool. Risks are created and linked in
   Compliance (an existing risk first, a new one only if none fits); this
   screen reads them from the shell (build_merge.py).
*/
.wrap{max-width:none;margin:0;padding:var(--space-6) var(--space-6) 80px}
.scroll{flex:1;overflow-y:auto;min-width:0}
.view-head{display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap}
.view-head h2{font-size:var(--text-lg);font-weight:600;letter-spacing:-.2px}
.view-head .sub{font-size:var(--text-sm);color:var(--text-3)}
.rk-tools{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3);flex-wrap:wrap}
.rk-tools input{background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--radius-md);padding:6px var(--space-3);font-size:var(--text-sm);color:var(--text);width:260px}
.rk-tools .spacer{flex:1}
.rk-count{font-size:var(--text-sm);color:var(--text-3)}
.rk-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;font-size:var(--text-sm)}
.rk-table th{text-align:left;font-size:var(--text-xs);font-weight:600;color:var(--text-3);background:var(--panel-2);padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--line);vertical-align:bottom}
.rk-table td{padding:var(--space-3);border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
.rk-table tr:last-child td{border-bottom:none}
.rk-table tr.focus td{background:var(--accent-soft)}
.rk-table .c-id{width:96px;font-family:var(--font-mono);font-size:var(--text-xs);font-weight:700;white-space:nowrap}
.rk-table .c-q{width:24%;color:var(--text)}
.rk-table .c-by{white-space:nowrap;color:var(--text-3);font-size:var(--text-xs)}
.rk-reqs{display:flex;flex-wrap:wrap;gap:4px}
.rk-req{font-family:var(--font-mono);font-size:var(--text-xs);font-weight:600;padding:1px 6px;border-radius:var(--radius-xs);border:1px solid var(--line-2);color:var(--text-2)}
.rk-req:hover{border-color:var(--accent);color:var(--accent)}
.rk-all{font-size:var(--text-xs);font-weight:600;color:var(--accent);padding:1px 4px}
.rk-none{font-size:var(--text-xs);color:var(--text-3)}
.rk-empty{padding:var(--space-8) var(--space-4);text-align:center;color:var(--text-3);font-size:var(--text-sm);line-height:1.6;background:var(--panel);border:1px dashed var(--line-2);border-radius:var(--radius-lg)}
.rk-empty b{color:var(--text-2)}
.rk-empty .btn-ghost{margin-top:var(--space-3)}
#toast-zone{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:var(--space-2);align-items:center}
.toast{display:flex;align-items:center;gap:var(--space-3);background:var(--panel-3);border:1px solid var(--line-2);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);font-size:var(--text-base);box-shadow:0 8px 32px rgba(0,0,0,.35)}
.toast .t-ok{color:var(--ok)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- brand touches (22 Sept 2026) ---------------------------------------
   Titles take the heading face. The red is DECORATIVE ONLY: a small mark
   ahead of page titles — never on anything clickable or stateful,
   because red already means "not compliant" / "warn" in this UI and a red
   control would read as an error. Exact brand red still to be confirmed. */
h1,h2,h3,.cfg-h,.set-title,.view-panel-head,.fb-bh{font-family:var(--font-heading)}
h1::before,h2::before{content:"";display:inline-block;width:5px;height:.85em;border-radius:2px;background:var(--brand-red);margin-right:.45em;vertical-align:-.08em}
/* icons (2026-09-24): one stroke style for every UI icon, drawn with a CSS mask so it takes the text colour.
   Replaces emoji (rendered as coloured Apple emoji) and symbols Noto Sans doesn't carry (rendered tiny or
   in a fallback font). Markup: <i class=ic-NAME></i> — no quotes, so it is safe inside any JS string. */
i[class^="ic-"]{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.16em;flex-shrink:0;background:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat;font-style:normal}

    <div class="crumb"><span class="sep">/</span><a class="project" id="crumb-project" href="javascript:parent.route('dashboard')" title="Back to the project dashboard">STB-2026 · Energy Monitoring System</a></div>
    <div class="hdr-actions" style="margin-left:auto">
      <a class="nav-btn" href="javascript:parent.route('compliance')" title="Compliance — where risks are linked to Not compliant requirements"><i class=ic-flag></i>Compliance</a>
      <a class="icon-btn" href="javascript:parent.route('config')" title="Project configuration — gap strategies are under Compliance"><i class=ic-sliders></i></a>
      <div class="avatar" id="header-avatar" title="Thibaud Breton">TB</div>
    </div>
  </header>
  <div class="scroll">
    <div class="wrap">
      <div class="view-head"><h2>Risks</h2><span class="sub">Each Not compliant should be traced to a risk; risks are reused — each justified by the three answers below</span></div>
      <div id="rk-register"></div>
    </div>
  </div>
</div>
<div id="toast-zone"></div>
<script>
(function(){
  try{
    const u=(window.parent!==window && window.parent.getCurrentUser) ? window.parent.getCurrentUser() : {name:"Thibaud Breton",title:"Bid Director",init:"TB"};
    const av=document.getElementById("header-avatar");
    if(av){ av.textContent=u.init; av.title=u.title?`${u.name} — ${u.title}`:u.name; }
  }catch(e){}
})();
(function(){ try{ const p=window.parent.getCurrentProject(); const el=document.getElementById("crumb-project"); if(p&&el) el.textContent=p.ref+" · "+p.name; }catch(e){} })();
const PROJECT_ID=(function(){ try{ return window.parent.getCurrentProject().id; }catch(e){ return "_"; } })();
function shell(name, ...args){ try{ if(window.parent!==window && window.parent[name]) return window.parent[name](PROJECT_ID, ...args); }catch(e){} return undefined; }
function go(route, focus){ try{ if(focus) window.parent.setScreenFocus(route, focus); window.parent.route(route); }catch(e){} }
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const RISK_Q=[["that","There is a risk that…"],["cause","The risk is caused by…"],["impact","The direct impact of the risk will be…"]];
const state={q:"", focus:null};
const risks=()=>shell("getRisks")||[];
/* the requirements each risk is linked to, read off the gap documentation Compliance writes */
function reqsOf(id){
  const out=[]; Object.values(shell("getGapDocs")||{}).forEach(d=>{ if((d.risks||[]).includes(id) && d.meta && !out.includes(d.meta.reqId)) out.push(d.meta.reqId); });
  return out;
}
function toast(msg,kind="ok"){
  const z=document.getElementById("toast-zone"),t=document.createElement("div");
  t.className="toast";
  t.innerHTML=`<span class="${kind==="ok"?"t-ok":""}" style="${kind==="warn"?"color:var(--warn)":""}">${kind==="ok"?"✓":"⚠"}</span><span>${msg}</span>`;
  z.appendChild(t);
  setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .3s";setTimeout(()=>t.remove(),300)},3600);
}
function visible(){
  const q=state.q.trim().toLowerCase();
  return risks().filter(x=>!q || [x.id,x.that,x.cause,x.impact].join(" ").toLowerCase().includes(q));
}
function render(){
  const el=document.getElementById("rk-register"), all=risks();
  if(!all.length){ el.innerHTML=`<div class="rk-empty"><b>No risk on this tender yet.</b><br>Risks are created in Compliance, when the responsible of a Not compliant requirement documents the gap — and reused from there.<br><button class="btn-ghost" id="go-compliance">Open Compliance →</button></div>`;
    document.getElementById("go-compliance").addEventListener("click",()=>go("compliance")); return; }
  const rows=visible();
  const a=document.activeElement, focusId=a&&a.id, pos=a&&a.selectionStart;
  el.innerHTML=`<div class="rk-tools">
      <input id="rk-q" placeholder="Search a risk — ID or words" value="${esc(state.q)}" autocomplete="off">
      <span class="rk-count">${rows.length===all.length?`${all.length} risk${all.length===1?"":"s"}`:`${rows.length} of ${all.length}`}</span>
      <span class="spacer"></span>
      <button class="btn-ghost" id="rk-export"><i class=ic-download></i> Export</button>
    </div>
    ${rows.length?`<table class="rk-table">
      <thead><tr><th>ID</th>${RISK_Q.map(([,q])=>`<th>${q}</th>`).join("")}<th>Requirements</th><th>Created by</th></tr></thead>
      <tbody>${rows.map(x=>{ const rq=reqsOf(x.id); return `<tr data-row="${x.id}" class="${state.focus===x.id?"focus":""}">
        <td class="c-id">${x.id}</td>
        ${RISK_Q.map(([k])=>`<td class="c-q">${esc(x[k])}</td>`).join("")}
        <td><div class="rk-reqs">${rq.length?rq.map(r=>`<button class="rk-req" data-goreq="${esc(r)}" title="Open ${esc(r)} in Compliance">${esc(r)}</button>`).join("")+(rq.length>1?`<button class="rk-all" data-golinks="${x.id}" title="Compliance filtered on ${x.id}">all →</button>`:""):`<span class="rk-none">none</span>`}</div></td>
        <td class="c-by">${esc(x.createdBy||"—")}<br>${esc(x.createdAt||"")}</td>
      </tr>`; }).join("")}</tbody></table>`
    :`<div class="rk-empty">No risk matches.</div>`}`;
  const $=s=>el.querySelector(s), $$=s=>el.querySelectorAll(s);
  $("#rk-q").addEventListener("input",e=>{ state.q=e.target.value; render(); });
  $("#rk-export").addEventListener("click",()=>toast(`Risk list exported — ${rows.length} risk${rows.length===1?"":"s"} with their justification (simulated)`,"ok"));
  $$("[data-goreq]").forEach(b=>b.addEventListener("click",()=>go("compliance",{select:b.dataset.goreq})));
  $$("[data-golinks]").forEach(b=>b.addEventListener("click",()=>go("compliance",{risk:b.dataset.golinks})));
  if(focusId){ const n=document.getElementById(focusId); if(n){ n.focus(); if(pos!=null) try{ n.setSelectionRange(pos,pos); }catch(e){} } }
}
/* "Open this risk" from Compliance: highlight it */
(function(){ const f=(function(){ try{ return window.parent.takeScreenFocus("risks"); }catch(e){ return null; } })(); if(f&&f.risk) state.focus=f.risk; })();
render();
if(state.focus){ const r=document.querySelector(`[data-row="${state.focus}"]`); if(r) r.scrollIntoView({block:"center"}); }
</script>
</body>
</html>
